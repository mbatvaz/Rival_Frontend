<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — Button</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Actions" height=700 subtitle="Flat fills only: ink to continue, green only where money is committed, red for destruction, white and smoke on dark surfaces, and a glass button for adding on a glass surface" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div class="rv-stack-lg">
  <div class="rv-card rv-glass rv-stack">
    <span class="rv-overline">اصلی</span>
    <div class="rv-row rv-wrap">
      <button class="rv-btn rv-btn--primary">ادامه<i class="ri ri-sm ri-arrow-left"></i></button>
      <button class="rv-btn rv-btn--accent"><i class="ri ri-card"></i>پرداخت ۱۸۰٬۰۰۰ تومان</button>
      <button class="rv-btn rv-btn--secondary">جابه‌جایی نوبت</button>
      <button class="rv-btn rv-btn--glass rv-glass">جزئیات</button>
      <button class="rv-btn rv-btn--ghost">بعداً</button>
    </div>
  </div>
  <div class="rv-grid-2" style="gap:16px">
    <div class="rv-card rv-glass rv-stack">
      <span class="rv-overline">معنادار و حالت‌ها</span>
      <div class="rv-row rv-wrap">
        <button class="rv-btn rv-btn--success"><i class="ri ri-check"></i>ثبت پذیرش</button>
        <button class="rv-btn rv-btn--danger"><i class="ri ri-trash"></i>حذف دائمی</button>
        <button class="rv-btn rv-btn--danger-soft">لغو نوبت</button>
      </div>
      <div class="rv-row rv-wrap">
        <button class="rv-btn rv-btn--primary is-loading" aria-busy="true">در حال ثبت</button>
        <button class="rv-btn rv-btn--accent is-loading" aria-busy="true">پرداخت</button>
        <button class="rv-btn rv-btn--primary" disabled>زمانی انتخاب نشده</button>
      </div>
    </div>
    <div class="rv-card rv-glass rv-stack">
      <span class="rv-overline">کوچک و آیکونی</span>
      <div class="rv-row rv-wrap">
        <button class="rv-btn rv-btn--secondary rv-btn--sm rv-btn--pill"><i class="ri ri-sm ri-phone"></i>تماس</button>
        <button class="rv-btn rv-btn--glass rv-glass rv-btn--sm rv-btn--pill"><i class="ri ri-sm ri-sms"></i>پیامک</button>
        <button class="rv-btn rv-btn--primary rv-btn--sm rv-btn--pill">رزرو<i class="ri ri-sm ri-arrow-left"></i></button>
      </div>
      <div class="rv-row rv-wrap">
        <button class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></button>
        <button class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></button>
        <button class="rv-icon-btn rv-icon-btn--ink" aria-label="رزرو دستی"><i class="ri ri-user-plus"></i></button>
        <button class="rv-icon-btn rv-icon-btn--accent" aria-label="رزرو جدید"><i class="ri ri-plus"></i></button>
        <button class="rv-icon-btn rv-icon-btn--plain" aria-label="بیشتر"><i class="ri ri-more"></i></button>
      </div>
    </div>
  </div>
  <div class="rv-card rv-card--inverse rv-between" style="padding:16px 20px">
    <div><span class="rv-overline" style="color:var(--text-inverse-muted)">روی سطح تیره</span><div class="rv-caption" style="color:var(--text-inverse-muted)">دکمه رنگی روی جوهر نمی‌نشیند؛ سفید برای اقدام اصلی، دودی برای بقیه. کارت نوبت جاری «ثبت انجام شد» و «عدم حضور» ندارد.</div></div>
    <div class="rv-row" style="gap:8px"><button class="rv-btn rv-btn--light rv-btn--sm"><i class="ri ri-sm ri-phone"></i>تماس</button><button class="rv-btn rv-btn--ink-soft rv-btn--sm"><i class="ri ri-sm ri-sms"></i>پیامک</button></div>
  </div>
  <div class="rv-between" style="padding:4px 4px">
    <div><span class="rv-overline">گونه شیشه‌ای <span class="rv-ltr">.rv-btn.is-glass</span></span><div class="rv-caption rv-muted">برای اقدام افزودن روی سطح شیشه‌ای — هم‌خانواده دکمه آیکونی بازگشت؛ جای دکمه جوهری پر و سنگین.</div></div>
    <button class="rv-btn is-glass"><i class="ri ri-plus"></i>نمونه‌کار تازه</button>
  </div>
</div></div>

</body></html>
