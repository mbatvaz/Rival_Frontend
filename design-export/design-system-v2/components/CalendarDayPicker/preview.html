<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — CalendarDayPicker</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Calendar" height=560 subtitle="Customer picks a day: only bookable days are raised white tiles; past, full and closed days stay flat; then the free times" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div class="rv-grid-2">
  <div class="rv-cal rv-cal--avail rv-glass">
    <div class="rv-cal__head"><button class="rv-icon-btn rv-icon-btn--plain" aria-label="ماه قبل" disabled style="opacity:.3"><i class="ri ri-chevron-right"></i></button><b>مهر ۱۴۰۵</b><button class="rv-icon-btn rv-icon-btn--plain" aria-label="ماه بعد"><i class="ri ri-chevron-left"></i></button></div>
    <div class="rv-cal__grid" role="grid" aria-label="مهر ۱۴۰۵"><div role="row"><span class="rv-cal__dow" role="columnheader">ش</span><span class="rv-cal__dow" role="columnheader">ی</span><span class="rv-cal__dow" role="columnheader">د</span><span class="rv-cal__dow" role="columnheader">س</span><span class="rv-cal__dow" role="columnheader">چ</span><span class="rv-cal__dow" role="columnheader">پ</span><span class="rv-cal__dow" role="columnheader">ج</span></div><div role="row"><span class="rv-day is-empty" role="gridcell"></span><span class="rv-day is-empty" role="gridcell"></span><span class="rv-day is-empty" role="gridcell"></span><span class="rv-day is-empty" role="gridcell"></span><button role="gridcell" class="rv-day is-past" disabled><i>۱</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۲</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۳</i></button></div><div role="row"><button role="gridcell" class="rv-day is-past" disabled><i>۴</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۵</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۶</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۷</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۸</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۹</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۱۰</i></button></div><div role="row"><button role="gridcell" class="rv-day is-past" disabled><i>۱۱</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۱۲</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۱۳</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۱۴</i></button><button role="gridcell" class="rv-day is-past" disabled><i>۱۵</i></button><button role="gridcell" class="rv-day is-today is-open is-few"><i>۱۶</i></button><button role="gridcell" class="rv-day is-holiday" disabled><i>۱۷</i></button></div><div role="row"><button role="gridcell" class="rv-day is-open"><i>۱۸</i></button><button role="gridcell" class="rv-day is-open" aria-selected="true"><i>۱۹</i></button><button role="gridcell" class="rv-day is-open"><i>۲۰</i></button><button role="gridcell" class="rv-day is-full" disabled><i>۲۱</i></button><button role="gridcell" class="rv-day is-open is-few"><i>۲۲</i></button><button role="gridcell" class="rv-day is-open"><i>۲۳</i></button><button role="gridcell" class="rv-day is-holiday" disabled><i>۲۴</i></button></div><div role="row"><button role="gridcell" class="rv-day is-open"><i>۲۵</i></button><button role="gridcell" class="rv-day is-open"><i>۲۶</i></button><button role="gridcell" class="rv-day is-open is-few"><i>۲۷</i></button><button role="gridcell" class="rv-day is-full" disabled><i>۲۸</i></button><button role="gridcell" class="rv-day is-open"><i>۲۹</i></button><button role="gridcell" class="rv-day is-open"><i>۳۰</i></button></div></div>
    <div class="rv-legend" style="margin-top:12px"><span><i style="background:var(--bg-surface);box-shadow:var(--shadow-sm)"></i>زمان آزاد</span><span><i style="width:6px;height:6px;border-radius:50%;background:var(--warning-solid)"></i>ظرفیت کم</span><span><i style="width:6px;height:6px;border-radius:50%;background:var(--accent-700)"></i>امروز</span><span><i style="border:1px solid var(--line-strong)"></i>پر یا گذشته</span><span style="color:var(--danger-fg)">تعطیل</span></div>
  </div>
  <div class="rv-stack-lg" style="gap:16px">
    <div class="rv-row"><span class="rv-tile"><i class="ri ri-calendar"></i></span><div><div class="rv-h-md">یکشنبه ۱۹ مهر</div><div class="rv-body-sm rv-muted">اصلاح سر و صورت<span class="rv-sep" aria-hidden="true"></span>۳۰ دقیقه<span class="rv-sep" aria-hidden="true"></span>با طاها</div></div></div>
    <div class="rv-slot-group"><span><i class="ri ri-sm ri-sun"></i>صبح</span><div class="rv-slots"><button class="rv-slot">۱۰:۰۰</button><button class="rv-slot" disabled>۱۰:۳۰</button><button class="rv-slot">۱۱:۳۰</button></div></div>
    <div class="rv-slot-group"><span><i class="ri ri-sm ri-clock"></i>ظهر</span><div class="rv-slots"><button class="rv-slot" aria-pressed="true">۱۴:۰۰</button><button class="rv-slot">۱۴:۳۰</button><button class="rv-slot" disabled>۱۵:۰۰</button><button class="rv-slot">۱۶:۰۰</button></div></div>
    <div class="rv-slot-group"><span><i class="ri ri-sm ri-moon"></i>عصر</span><div class="rv-slots"><button class="rv-slot">۱۸:۰۰</button><button class="rv-slot">۱۸:۳۰</button></div></div>
    <div class="rv-notice is-neutral"><i class="ri ri-bell-ring"></i><div><div class="rv-notice__t">زمان دلخواهتان پر است؟</div><div class="rv-notice__d">اعلان آزاد شدن بگیرید — بدون اولویت و بدون نگه‌داشت.</div></div></div>
  </div>
</div></div>
<script>
document.querySelectorAll('.rv-day.is-open').forEach(function(d){d.addEventListener('click',function(){document.querySelectorAll('.rv-day').forEach(function(x){x.removeAttribute('aria-selected')});d.setAttribute('aria-selected','true');});});
document.querySelectorAll('.rv-slot:not([disabled])').forEach(function(s){s.addEventListener('click',function(){document.querySelectorAll('.rv-slot').forEach(function(x){x.setAttribute('aria-pressed','false')});s.setAttribute('aria-pressed','true');});});
</script>
</body></html>
