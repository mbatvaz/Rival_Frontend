<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — Cover</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=960 height=300 -->
<div class="rv rv-final" style="position:relative;width:960px;height:300px;min-height:0;overflow:hidden;direction:ltr">
  <style>
    .cv-name{position:absolute;left:52px;bottom:70px;margin:0;font-family:var(--font-display);font-size:96px;line-height:1;font-weight:300;color:var(--text-primary);letter-spacing:2px}
    .cv-tag{position:absolute;left:56px;bottom:34px;margin:0;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text-muted);direction:rtl;text-align:left}
  </style>
  <svg viewBox="0 0 960 300" width="960" height="300" style="position:absolute;inset:0" aria-hidden="true">
    <defs>
      <linearGradient id="cv-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bg-inverse-raised)"/><stop offset="1" stop-color="var(--bg-inverse)"/></linearGradient>
      <linearGradient id="cv-chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg-surface)"/><stop offset=".48" stop-color="var(--chrome-100)"/><stop offset="1" stop-color="var(--chrome-300)"/></linearGradient>
      <linearGradient id="cv-accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent-300)"/><stop offset=".62" stop-color="var(--accent-500)"/><stop offset="1" stop-color="var(--accent-700)"/></linearGradient>
      <linearGradient id="cv-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--chrome-300)"/><stop offset="1" stop-color="var(--chrome-500)"/></linearGradient>
      <clipPath id="cv-slab"><rect x="560" y="-24" width="176" height="290" rx="22"/></clipPath>
    </defs>
    <!-- one ink slab bleeding off the top, cut by three slanted strokes (the RIVAL wordmark motif); chrome, accent and steel tiles stacked to its right on a 16px gap -->
    <rect x="560" y="-24" width="176" height="290" rx="22" fill="url(#cv-ink)"/>
    <g clip-path="url(#cv-slab)" fill="var(--bg-gradient-b)">
      <polygon points="582,-24 594,-24 686,266 674,266"/>
      <polygon points="614,-24 626,-24 718,266 706,266"/>
      <polygon points="646,-24 658,-24 750,266 738,266"/>
    </g>
    <rect x="752" y="34" width="176" height="128" rx="22" fill="url(#cv-chrome)" stroke="rgba(255,255,255,.9)"/>
    <rect x="752" y="178" width="84" height="84" rx="22" fill="var(--accent-500)"/>
    <rect x="852" y="178" width="130" height="84" rx="22" fill="url(#cv-steel)"/>
  </svg>
  <h1 class="cv-name">Rival</h1>
  <p class="cv-tag">سفید، طوسی و جوهریِ سالن — با شیشه، کروم و سبز تیره.</p>
</div>

</body></html>
