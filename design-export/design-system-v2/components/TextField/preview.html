<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — TextField</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Inputs" height=480 subtitle="Solid white fields on glass: rest, focus (ink ring), error, read-only; glass search; upload" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div class="rv-card rv-glass rv-card--lg">
  <div class="rv-grid-2" style="gap:18px 24px">
    <div class="rv-field"><label for="a">شماره موبایل</label><div class="rv-input"><i class="ri ri-smartphone"></i><input id="a" class="rv-ltr" inputmode="tel" placeholder="۰۹۱۴ ۰۰۰ ۰۰۰۰"></div><span class="rv-help">کد ورود به این شماره پیامک می‌شود.</span></div>
    <div class="rv-field"><label for="b">نام و نام خانوادگی</label><div class="rv-input is-focus"><i class="ri ri-user"></i><input id="b" value="امیر حسینی"></div><span class="rv-help">در حال ویرایش</span></div>
    <div class="rv-field"><label for="c">مبلغ نهایی رزرو</label><div class="rv-input is-invalid"><i class="ri ri-tag"></i><input id="c" value="۱۵٬۵۰۰"><span class="rv-affix">تومان</span></div><span class="rv-help is-error"><i class="ri ri-sm ri-alert"></i>مبلغ باید عدد صحیح تومان باشد، مثلاً ۲۲۰٬۰۰۰.</span></div>
    <div class="rv-field"><label>نوع خدمت</label><div class="rv-input is-readonly"><i class="ri ri-lock"></i><input value="ثابت" readonly></div><span class="rv-help">نوع خدمت پس از ایجاد تغییر نمی‌کند.</span></div>
    <div class="rv-input rv-input--search" style="grid-column:1/-1"><i class="ri ri-search"></i><input placeholder="جستجوی نام، شماره یا کد پیگیری"><button class="rv-icon-btn rv-icon-btn--ink" style="width:40px;height:40px" aria-label="فیلتر"><i class="ri ri-sm ri-filter"></i></button></div>
    <div class="rv-upload" style="grid-column:1/-1"><span class="rv-tile"><i class="ri ri-upload"></i></span><div class="rv-grow"><div class="rv-title">افزودن تصویر نمونه‌کار</div><div class="rv-caption rv-muted">JPG یا PNG، حداکثر ۵ تصویر؛ به WebP زیر ۱ مگابایت تبدیل می‌شود</div></div><button class="rv-btn rv-btn--secondary rv-btn--sm">انتخاب فایل</button></div>
  </div>
</div></div>

</body></html>
