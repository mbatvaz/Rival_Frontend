<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — PortfolioCard</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Domain" height=560 subtitle="Portfolio — public grid with a glass caption and service filter; the stylist's view adds the hidden state and the add tile" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div class="rv-stack">
  <div class="rv-between"><div class="rv-row" style="gap:6px"><button class="rv-chip" aria-pressed="true">همه</button><button class="rv-chip">فید</button><button class="rv-chip">ریش</button><button class="rv-chip">پوست</button></div><span class="rv-caption rv-muted">نمای آرایشگر</span></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
    <figure class="rv-hero" style="min-height:230px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/real-hall/salon-1.jpg" alt=""><div class="rv-hero__top" style="top:8px;inset-inline:8px"><span class="rv-tag rv-tag--glass">۳ تصویر</span></div><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">فید کوتاه با خط ریش</div><div class="rv-caption rv-muted">طاها<span class="rv-sep" aria-hidden="true"></span>۳ روز پیش</div></figcaption></figure>
    <figure class="rv-hero" style="min-height:230px;margin:0;padding:8px;box-shadow:var(--shadow-sm);--focus:center 20%"><img src="../../assets/photos/stylists/stylist-1.webp" alt=""><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">فرم ریش</div><div class="rv-caption rv-muted">مهدی<span class="rv-sep" aria-hidden="true"></span>هفته پیش</div></figcaption></figure>
    <figure class="rv-hero" style="min-height:230px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/real-hall/salon-2.jpg" alt="" style="filter:grayscale(1);opacity:.75"><div class="rv-hero__top" style="top:8px;inset-inline:8px"><span class="rv-tag rv-tag--glass"><i class="ri ri-eye-off"></i>مخفی</span></div><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label rv-secondary" style="font-size:13px">حالت‌دهی موی بلند</div><div class="rv-caption rv-muted">فقط شما می‌بینید</div></figcaption></figure>
    <button class="rv-add" style="min-height:230px"><span class="rv-tile rv-tile--lg"><i class="ri ri-lg ri-upload"></i></span>نمونه‌کار جدید<span class="rv-caption rv-muted" style="font-weight:400">تا ۵ تصویر، WebP زیر ۱ مگابایت</span></button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
    <figure class="rv-hero" style="min-height:200px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/services/service-2.webp" alt=""><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">کلاسیک ساید</div><div class="rv-caption rv-muted">آرین</div></figcaption></figure>
    <figure class="rv-hero" style="min-height:200px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/services/service-3.webp" alt=""><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">فیشیال</div><div class="rv-caption rv-muted">طاها</div></figcaption></figure>
    <figure class="rv-hero" style="min-height:200px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/services/service-4.webp" alt=""><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">رنگ ریش</div><div class="rv-caption rv-muted">مهدی</div></figcaption></figure>
    <figure class="rv-hero" style="min-height:200px;margin:0;padding:8px;box-shadow:var(--shadow-sm)"><img src="../../assets/photos/hall-ai/hall-2.webp" alt=""><figcaption class="rv-hero__panel rv-glass-strong" style="padding:8px 12px"><div class="rv-label" style="font-size:13px">فضای سالن</div><div class="rv-caption rv-muted">ریوال</div></figcaption></figure>
  </div>
</div></div>

</body></html>
