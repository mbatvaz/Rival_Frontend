<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — Logo</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Brand" height=420 subtitle="Full logo, mark, reversed and the chrome sign on glass — never coloured, stretched or shadowed" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;align-items:stretch">
  <div class="rv-card rv-glass rv-card--lg" style="display:grid;place-items:center;min-height:150px"><img src="../../assets/logo/rival-logo.png" alt="Rival" style="height:46px"></div>
  <div class="rv-card rv-glass rv-card--lg" style="display:grid;place-items:center"><img src="../../assets/logo/rival-mark.png" alt="نشان ریوال" style="height:66px"></div>
  <div class="rv-card rv-card--inverse" style="display:grid;place-items:center"><span class="rv-logo-ink" style="height:30px;color:var(--text-inverse)" role="img" aria-label="Rival"></span></div>
  <div style="grid-column:1 / span 2;position:relative;border-radius:var(--radius-lg);overflow:hidden;min-height:180px;display:grid;place-items:center">
    <img src="../../assets/photos/hall-ai/hall-1.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div class="rv-glass rv-sheen" style="position:relative;border-radius:var(--radius-xl);padding:20px 40px"><span class="rv-logo-chrome" style="height:46px" role="img" aria-label="Rival"></span></div>
  </div>
  <div class="rv-card rv-glass" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
    <span class="rv-tile" style="width:72px;height:72px;border-radius:22px"><span class="rv-mark-ink" style="height:38px;color:var(--text-primary)"></span></span>
    <span class="rv-caption rv-muted">آیکون اپ و فاوآیکون روی کاشی کروم</span>
  </div>
</div></div>

</body></html>
