<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — StatCard</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Dashboard" height=280 subtitle="Contextual counts, not a KPI system — glass stat cards with a gradient tile, a ring and a quiet week meter" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch">
  <div class="rv-card rv-glass rv-stat"><div class="rv-stat__l"><span class="rv-tile rv-tile--sm"><i class="ri ri-sm ri-calendar"></i></span>نوبت‌های امروز سالن</div><div class="rv-stat__v">۱۸</div><div class="rv-progress"><i style="width:39%"></i></div><div class="rv-stat__s">۷ انجام شده<span class="rv-sep" aria-hidden="true"></span>۳ آرایشگر</div></div>
  <div class="rv-card rv-glass rv-stat"><div class="rv-stat__l"><span class="rv-tile rv-tile--sm is-plum"><i class="ri ri-sm ri-inbox"></i></span>نیازمند اقدام</div><div class="rv-stat__v">۳</div><div class="rv-row" style="gap:6px"><span class="rv-tag is-plum">۲ درخواست</span><span class="rv-tag is-info">۱ پرداخت</span></div><a class="rv-link" href="#">مرکز اقدام<i class="ri ri-sm ri-chevron-left"></i></a></div>
  <div class="rv-card rv-glass rv-stat" style="align-items:center;text-align:center"><div class="rv-stat__l">برنامه امروز من</div><div class="rv-gauge" style="width:120px;height:120px"><svg viewBox="0 0 168 168"><circle class="trk" cx="84" cy="84" r="74"/><circle class="val is-ink" cx="84" cy="84" r="74" stroke-dasharray="465" stroke-dashoffset="102"/></svg><div class="rv-gauge__c"><b style="font-size:28px;line-height:32px">۶</b><span>نوبت</span></div></div><div class="rv-stat__s">۷۸٪ ظرفیت</div></div>
  <div class="rv-card rv-glass rv-stat"><div class="rv-stat__l">ظرفیت این هفته</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;height:110px;padding:0 4px">
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px"><i style="height:62%"></i></div><small class="rv-caption rv-muted">ش</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px"><i style="height:80%;animation-delay:.05s"></i></div><small class="rv-caption rv-muted">ی</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px"><i style="height:45%;animation-delay:.1s"></i></div><small class="rv-caption rv-muted">د</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px"><i style="height:70%;animation-delay:.15s"></i></div><small class="rv-caption rv-muted">س</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px"><i style="height:55%;animation-delay:.2s"></i></div><small class="rv-caption rv-muted">چ</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px;box-shadow:inset 0 0 0 1.5px var(--accent-500)"><i style="height:92%;animation-delay:.25s"></i></div><small class="rv-caption rv-accent">پ</small></div>
      <div class="rv-stack" style="gap:6px;align-items:center"><div class="rv-vbar" style="height:90px;opacity:.4"></div><small class="rv-caption rv-muted">ج</small></div>
    </div>
    <div class="rv-stat__s">۶۸٪ پر شده</div></div>
</div></div>

</body></html>
