<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival — OtpInput</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/rival.css"><style>body{margin:0}</style></head>
<body>
<!-- @dsCard width=900 group="Inputs" height=420 subtitle="OTP sign-in on a glass card: typing, wrong code (shake + attempts left), verified" -->
<div class="rv rv-final rv-pad" dir="rtl" lang="fa"><div class="rv-grid-2" style="align-items:center">
  <div class="rv-card rv-glass-strong rv-card--lg rv-stack" style="gap:16px;text-align:center;align-items:center">
    <span class="rv-tile rv-tile--lg"><span class="rv-mark-ink" style="height:28px"></span></span>
    <div><div class="rv-h-md">کد تایید را وارد کنید</div><div class="rv-body-sm rv-muted">به <bdi dir="ltr">۰۹۱۴ ۳۲۱ ۴۵۶۷</bdi> پیامک شد<span class="rv-sep"></span><a class="rv-link" href="#">ویرایش شماره</a></div></div>
    <div class="rv-otp" aria-label="کد ۵ رقمی"><span>۴</span><span>۸</span><span class="is-active"></span><span></span><span></span></div>
    <span class="rv-help">ارسال دوباره تا <bdi dir="ltr">۰:۴۲</bdi></span>
    <button class="rv-btn rv-btn--primary rv-btn--block" disabled>ورود</button>
  </div>
  <div class="rv-stack-lg">
    <div class="rv-stack" style="align-items:center"><div class="rv-otp is-error"><span>۱</span><span>۲</span><span>۳</span><span>۴</span><span>۵</span></div><span class="rv-help is-error"><i class="ri ri-sm ri-alert"></i>کد درست نیست؛ ۲ تلاش دیگر تا قفل ۱۵ دقیقه‌ای</span></div>
    <div class="rv-stack" style="align-items:center"><div class="rv-otp is-ok"><span>۴</span><span>۸</span><span>۲</span><span>۷</span><span>۰</span></div><span class="rv-help is-ok"><i class="ri ri-sm ri-check-circle"></i>تایید شد</span></div>
    <button class="rv-btn rv-btn--glass rv-glass"><i class="ri ri-fingerprint"></i>ورود با Passkey</button>
  </div>
</div></div>

</body></html>
