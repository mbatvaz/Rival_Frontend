<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 700px;">
  <header class="f-bar-in">
    <a href="#more" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>آرایشگران</h1>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
  </header>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <!-- [مدیر] جست‌وجو و زبانهٔ فعال/غیرفعال جای فیلتر؛ آرایشگر حذف‌شده در فهرست نیست -->
    <label class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><input placeholder="جست‌وجوی آرایشگر" aria-label="جست‌وجوی آرایشگر"></label>
    <div class="rv-seg rv-glass b4-seg-full" role="tablist" aria-label="وضعیت آرایشگر"><button type="button" role="tab" aria-selected="false">فعال<span class="b4-n">۵</span></button><button type="button" role="tab" aria-selected="true">غیرفعال<span class="b4-n">۱</span></button></div>
    <div class="b3-tools"><span class="b3-tools__sum"><b>۱</b> آرایشگر غیرفعال</span><a href="/admin/stylists/new" class="rv-btn rv-btn--primary rv-btn--sm"><i class="ri ri-sm ri-user-plus"></i>افزودن آرایشگر</a></div>
    <section role="tabpanel" aria-label="فهرست آرایشگران">
      <div class="rv-list rv-glass">
        <a class="rv-item b4-cr" href="/admin/stylists/5">
          <span class="rv-avatar">پ</span>
          <div class="rv-grow" style="min-width: 0;"><div class="b4-cr__t">پدرام شکوهی</div><div class="b4-cr__p">۳ خدمت</div></div>
          <div class="b4-cr__when"><span class="b4-cr__l">نوبت پیش رو</span><b>۳</b></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i>
        </a>
      </div>
    </section>
  </main>
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-label="درخواست‌ها، ۴ درخواست منتظر پاسخ شما"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۴</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-current="page" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
