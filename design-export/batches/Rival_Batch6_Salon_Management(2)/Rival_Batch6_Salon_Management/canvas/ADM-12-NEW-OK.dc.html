<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 710px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>خدمت تازه</h1>
    <a href="/admin/services" class="rv-icon-btn" aria-label="بستن"><i class="ri ri-x"></i></a>
  </header>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) var(--space-8); display: flex; flex-direction: column; gap: var(--space-5);">

      <span class="rv-tile rv-tile--xl is-success" aria-hidden="true"><i class="ri ri-check-circle"></i></span>
      <h2 class="b2-res__t">ماساژ سر اضافه شد</h2>
      <p class="b2-res__d">خدمت ثابت، ۳۰ دقیقه.</p>
      <span class="rv-tag is-warning" style="margin-top: var(--space-2);"><i class="ri ri-alert"></i>بدون آرایشگر؛ رزرو نمی‌گیرد</span>
      <div class="b6-nx">
        <div class="f-head"><h3 class="f-h">برای رزرو گرفتن</h3></div>
        <div class="rv-list rv-glass">
          <a class="rv-item" href="/admin/services/11#barbers"><span class="rv-tile rv-tile--sm" aria-hidden="true"><i class="ri ri-stylist"></i></span><div class="rv-grow" style="min-width: 0;"><div class="rv-item__t">آرایشگرها را نگاشت کنید</div><div class="rv-item__s">چه کسانی این خدمت را انجام می‌دهند</div></div><i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i></a>
          <a class="rv-item" href="/admin/services/11#pattern"><span class="rv-tile rv-tile--sm" aria-hidden="true"><i class="ri ri-calendar-clock"></i></span><div class="rv-grow" style="min-width: 0;"><div class="rv-item__t">الگوی ارائه را تنظیم کنید</div><div class="rv-item__s">روزها و ساعت‌هایی که خدمت ارائه می‌شود</div></div><i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>
    <div class="b4-acts"><a href="/admin/services/11" class="rv-btn rv-btn--primary rv-btn--block">رفتن به صفحهٔ خدمت</a><a href="/admin/services/new" class="rv-btn rv-btn--secondary rv-btn--block">افزودن خدمت دیگر</a></div>
