<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-NOT — اعلان تازه — برگه انتخاب گیرنده (مشتری و آرایشگر)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
<link rel="stylesheet" href="rv-b6.css">
<link rel="stylesheet" href="rv-b7.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 900px;">
  <div aria-hidden="true" inert style="position: absolute; inset: 0; overflow: hidden;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>اعلان تازه</h1>
    <a href="/admin/notifications" class="rv-icon-btn" aria-label="بستن"><i class="ri ri-x"></i></a>
  </header>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 140px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b5-mode" role="radiogroup" aria-label="نوع اعلان"><button type="button" role="radio" aria-checked="false"><i class="ri ri-sm ri-users"></i>عمومی</button><button type="button" role="radio" aria-checked="true"><i class="ri ri-sm ri-user"></i>شخصی</button></div>
    <div class="rv-field" style="margin: 0;"><span class="rv-label">گیرنده</span>
      <button type="button" class="rv-card rv-glass b6-bc b6-bc--btn" aria-haspopup="dialog" style="margin-top: var(--space-2);"><span class="rv-avatar">س</span><span class="rv-grow" style="min-width: 0;"><span class="b6-bc__l">فقط به همین کاربر می‌رسد</span><b>سامان نوری</b></span><span class="rv-tag is-outline">مشتری</span><i class="ri ri-chevron-left" aria-hidden="true"></i></button>
    </div>
    <div class="rv-field" style="margin: 0;"><label class="rv-label" for="nt-t">عنوان</label><div class="rv-input"><input id="nt-t" value="نوبت شما با تأخیر شروع می‌شود" autocomplete="off"></div></div>
    <div class="rv-field" style="margin: 0;"><label class="rv-label" for="nt-x">متن</label><div class="rv-input b4-ta"><textarea id="nt-x" rows="4">آقای نوری، نوبت امروز شما حدود ۲۰ دقیقه دیرتر شروع می‌شود. ممنون از شکیبایی‌تان.</textarea></div></div>
    <fieldset class="b3-fs"><legend class="rv-label">سطح اهمیت</legend>
      <div class="b5-mode" role="radiogroup" aria-label="سطح اهمیت"><button type="button" role="radio" aria-checked="true">عادی</button><button type="button" role="radio" aria-checked="false"><i class="ri ri-sm ri-alert" aria-hidden="true"></i>بسیار بالا</button></div>
      <p class="rv-help" style="margin: var(--space-2) 0 0;">فقط اهمیت «بسیار بالا» در داشبورد کاربران برجسته می‌شود؛ بقیه فقط در مرکز اعلان‌اند.</p>
    </fieldset>
  </main>
  </div>
  <div class="rv-scrim" aria-hidden="true"></div>
  <section class="rv-sheet rv-glass-strong b2-sheet" role="dialog" aria-modal="true" aria-labelledby="rc-t" style="display: flex; flex-direction: column; gap: var(--space-4);">
    <span class="b2-grip" aria-hidden="true"></span>
    <div class="b2-sheet__head">
      <span class="rv-tile"><i class="ri ri-user"></i></span>
      <div class="rv-grow"><h2 id="rc-t" class="b2-sheet__t">انتخاب گیرنده</h2><p class="b2-sheet__d">نتایج هم مشتری‌اند هم آرایشگر؛ نقش کنار نام است.</p></div>
      <button type="button" class="rv-icon-btn rv-icon-btn--plain" aria-label="بستن برگه"><i class="ri ri-x"></i></button>
    </div>
    <label class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><input value="ام" aria-label="جست‌وجوی گیرنده"></label>
    <div class="b3-tools"><span class="b3-tools__sum"><b>۴</b> نتیجه برای «ام»</span></div>
    <div class="b6-pk b7-pk" role="radiogroup" aria-label="نتایج">
        <button type="button" role="radio" aria-checked="true" class="b6-pk__r is-on"><span class="rv-avatar rv-avatar--sm" aria-hidden="true">س</span><span class="rv-grow" style="min-width: 0;"><span class="rv-item__t" style="display: block;">سامان نوری</span><span class="rv-item__s" style="display: block;"><bdi dir="ltr">۰۹۱۴ ۳۹۰ ۱۲۵۸</bdi></span></span><span class="rv-tag is-outline" style="margin-inline-start: auto; flex: none;">مشتری</span></button>
        <button type="button" role="radio" aria-checked="false" class="b6-pk__r"><span class="rv-avatar rv-avatar--sm" aria-hidden="true">ا</span><span class="rv-grow" style="min-width: 0;"><span class="rv-item__t" style="display: block;">امیر حسینی</span><span class="rv-item__s" style="display: block;"><bdi dir="ltr">۰۹۱۴ ۱۱۰ ۴۴۲۰</bdi></span></span><span class="rv-tag is-outline" style="margin-inline-start: auto; flex: none;">آرایشگر</span></button>
        <button type="button" role="radio" aria-checked="false" class="b6-pk__r"><span class="rv-avatar rv-avatar--sm" aria-hidden="true">ا</span><span class="rv-grow" style="min-width: 0;"><span class="rv-item__t" style="display: block;">امین سلطانی</span><span class="rv-item__s" style="display: block;"><bdi dir="ltr">۰۹۱۴ ۶۴۴ ۲۰۷۱</bdi></span></span><span class="rv-tag is-outline" style="margin-inline-start: auto; flex: none;">مشتری</span></button>
        <button type="button" role="radio" aria-checked="false" class="b6-pk__r"><span class="rv-avatar rv-avatar--sm" aria-hidden="true">س</span><span class="rv-grow" style="min-width: 0;"><span class="rv-item__t" style="display: block;">سینا امامی</span><span class="rv-item__s" style="display: block;"><bdi dir="ltr">۰۹۱۴ ۲۳۵ ۹۰۱۸</bdi></span></span><span class="rv-tag is-outline" style="margin-inline-start: auto; flex: none;">آرایشگر</span></button>
    </div>
    <div class="b2-sheet__acts"><button type="button" class="rv-btn rv-btn--primary">تأیید گیرنده</button><button type="button" class="rv-btn rv-btn--secondary">انصراف</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
