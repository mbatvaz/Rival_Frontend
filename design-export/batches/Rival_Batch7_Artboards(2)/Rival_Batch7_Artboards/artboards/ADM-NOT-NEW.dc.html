<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-NOT — اعلان تازه — عمومی</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
<link rel="stylesheet" href="rv-b6.css">
<link rel="stylesheet" href="rv-b7.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 920px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>اعلان تازه</h1>
    <a href="/admin/notifications" class="rv-icon-btn" aria-label="بستن"><i class="ri ri-x"></i></a>
  </header>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 140px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b5-mode" role="radiogroup" aria-label="نوع اعلان"><button type="button" role="radio" aria-checked="true"><i class="ri ri-sm ri-users"></i>عمومی</button><button type="button" role="radio" aria-checked="false"><i class="ri ri-sm ri-user"></i>شخصی</button></div>
    <p class="b4-hint" style="margin: 0;"><i class="ri ri-info" aria-hidden="true"></i>برای همهٔ کاربران سامانه ساخته می‌شود و در مرکز اعلان آن‌ها می‌آید.</p>
    <div class="rv-field" style="margin: 0;"><label class="rv-label" for="nt-t">عنوان</label><div class="rv-input"><input id="nt-t" value="از ۱ آذر شنبه‌ها از ساعت ۱۰:۰۰ باز هستیم" autocomplete="off"></div></div>
    <div class="rv-field" style="margin: 0;"><label class="rv-label" for="nt-x">متن</label><div class="rv-input b4-ta"><textarea id="nt-x" rows="4">از اول آذر روزهای شنبه یک ساعت زودتر پذیرش داریم. برای نوبت صبح می‌توانید از همین حالا رزرو کنید.</textarea></div></div>
    <fieldset class="b3-fs"><legend class="rv-label">سطح اهمیت</legend>
      <div class="b5-mode" role="radiogroup" aria-label="سطح اهمیت"><button type="button" role="radio" aria-checked="false">عادی</button><button type="button" role="radio" aria-checked="true"><i class="ri ri-sm ri-alert" aria-hidden="true"></i>بسیار بالا</button></div>
      <p class="rv-help" style="margin: var(--space-2) 0 0;">فقط اهمیت «بسیار بالا» در داشبورد کاربران برجسته می‌شود؛ بقیه فقط در مرکز اعلان‌اند.</p>
    </fieldset>
  </main>
  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">اعلان عمومی</span><span class="b2-bar__s">اهمیت بسیار بالا</span></div>
    <button type="button" class="rv-btn rv-btn--primary">پیش‌نمایش</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
