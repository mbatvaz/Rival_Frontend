<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="#step-1" class="rv-icon-btn" aria-label="بازگشت به مرحله قبل"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو دستی</h1>
    <a href="/admin" class="rv-icon-btn" aria-label="بستن رزرو دستی"><i class="ri ri-x"></i></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4);">
    <nav class="b4-steps" aria-label="مرحله ۲ از ۵، مشتری"><ol style="grid-template-columns: repeat(5, minmax(0, 1fr));"><li class="is-done"><span>آرایشگر</span></li><li class="is-on" aria-current="step"><span>مشتری</span></li><li><span>خدمت</span></li><li><span>زمان</span></li><li><span>تأیید</span></li></ol></nav>
    <!-- [مدیر] آرایشگر انتخاب‌شده، فشرده بالای صفحه (همان b4-mctx گام‌های بعدی STY-07) -->
    <div class="rv-card rv-glass b4-mctx"><div class="b4-mctx__r"><span class="rv-avatar">ا</span><div class="rv-grow" style="min-width: 0;"><b>امیر</b><span>آرایشگر</span></div></div></div>
    <section aria-labelledby="c-h" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <h2 id="c-h" class="f-h" style="margin: 0;">مشتری را پیدا کنید</h2>
      <label class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><input placeholder="نام یا شماره موبایل مشتری" aria-label="جست‌وجوی مشتری" value="سامان"><button type="button" class="rv-icon-btn rv-icon-btn--plain" aria-label="پاک کردن جست‌وجو" style="margin-inline-end: -10px;"><i class="ri ri-sm ri-x"></i></button></label>
      <!-- [مدیر] جست‌وجو در همه مشتریان سالن (بدون محدودیت D10-01)؛ نتیجه فقط نام و شماره؛ زدن روی نتیجه مستقیم به گام بعد می‌رود -->
      <p class="b4-sres__lbl"><b>۲</b> نتیجه برای «سامان»</p>
      <div class="rv-card rv-glass b4-sres" role="list">
        <a href="#pick" class="b4-sres__i"><span class="rv-avatar"><img src="/_blob/073e8bab91cfbb056ea68d266d51cbe7" alt=""></span><span class="rv-grow" style="min-width: 0;"><span class="b4-sres__n">سامان نوری</span><span class="b4-sres__p">۰۹۱۴ ۳۹۰ ۱۲۵۸</span></span><i class="ri ri-chevron-left" aria-hidden="true"></i></a>
        <a href="#pick" class="b4-sres__i"><span class="rv-avatar">س</span><span class="rv-grow" style="min-width: 0;"><span class="b4-sres__n">سامان کریمی</span><span class="b4-sres__p">۰۹۱۲ ۷۷۴ ۰۶۳۱</span></span><i class="ri ri-chevron-left" aria-hidden="true"></i></a>
      </div>
      <p class="b4-sres__more">مشتری مورد نظر نیست؟ <a href="#add" class="rv-link" aria-haspopup="dialog">افزودن مشتری جدید</a></p>
    </section>
