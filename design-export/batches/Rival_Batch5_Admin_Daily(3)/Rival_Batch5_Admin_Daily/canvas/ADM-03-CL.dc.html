<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-03 — درخواست‌ها — بسته‌شده، Scope «من»</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="rv-topbar">
    <h1 class="rv-topbar__title" style="margin: 0;">درخواست‌ها</h1>
    <span class="rv-grow"></span>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
    <a href="/admin/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>

  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <!-- [مدیر] Scope دوبخشی (D10-112) فقط در نوع «پیشنهادی» -->
    <div class="f-scope">
      <span class="f-scope__lbl">درخواست‌های</span>
      <div class="rv-seg rv-glass" role="tablist" aria-label="دامنه نمایش" style="display: flex;">
        <button role="tab" aria-selected="true" style="flex: 1; justify-content: center;"><i class="ri ri-sm ri-user"></i>من</button>
        <button role="tab" aria-selected="false" aria-haspopup="dialog" aria-expanded="false" style="flex: 1; justify-content: center;">آرایشگر<i class="ri ri-sm ri-chevron-down"></i></button>
      </div>
    </div>
    <div class="b4-tabrow">
      <div class="rv-seg rv-glass b4-seg-full is-3" role="tablist" aria-label="وضعیت درخواست‌ها">
        <button type="button" id="tab-open" role="tab" aria-selected="false" aria-controls="p-open">باز<span class="b4-n" aria-label="۴ درخواست">۴</span></button>
        <button type="button" id="tab-wait" role="tab" aria-selected="false" aria-controls="p-wait">در انتظار<span class="b4-n" aria-label="۲ درخواست">۲</span></button>
        <button type="button" id="tab-closed" role="tab" aria-selected="true" aria-controls="p-closed">بسته‌شده<span class="b4-n" aria-label="۳ درخواست">۳</span></button>
      </div>
      <div class="rv-card rv-glass b4-fcard is-icon"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b4-fcard__b" aria-haspopup="dialog" aria-label="فیلتر درخواست‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <div id="p-closed" role="tabpanel" aria-labelledby="tab-closed" style="display: flex; flex-direction: column; gap: var(--space-5);">
    <!-- بسته‌شده در ۷ روز اخیر: ردیف خاکستری، فقط برای اطلاع؛ نام آرایشگر در خط دوم (به‌جای f-who تا ردیف شلوغ نشود) -->
    <section aria-labelledby="q-cl">
      <div class="f-head"><h2 id="q-cl" class="f-h">۷ روز اخیر</h2><span class="rv-caption rv-muted">۳ درخواست</span></div>
      <div class="rv-list rv-glass">
        <div class="b4-rq is-off">
          <span class="rv-avatar b4-rq__av">ر</span>
          <div class="rv-grow" style="min-width: 0;"><a href="/admin/requests/RQ-2201" class="f-stretch b4-rq__t" style="display: block; color: inherit; text-decoration: none;">پکیج دامادی</a><div class="b4-rq__s">رضا کریمی<span class="rv-sep" aria-hidden="true"></span>چندخدمتی<span class="rv-sep" aria-hidden="true"></span>۲۵ مهر</div></div>
          <span class="rv-tag is-ink b4-rq__tag"><i class="ri ri-check-circle"></i>نوبت‌ها ثبت شد</span>
        </div>
        <div class="b4-rq is-off">
          <span class="rv-avatar b4-rq__av">ع</span>
          <div class="rv-grow" style="min-width: 0;"><a href="/admin/requests/RQ-2202" class="f-stretch b4-rq__t" style="display: block; color: inherit; text-decoration: none;">رنگ ریش</a><div class="b4-rq__s">علی محمدی<span class="rv-sep" aria-hidden="true"></span>شما<span class="rv-sep" aria-hidden="true"></span>۲۳ مهر</div></div>
          <span class="rv-tag is-rose b4-rq__tag"><i class="ri ri-x-circle"></i>لغو مشتری</span>
        </div>
        <div class="b4-rq is-off">
          <span class="rv-avatar b4-rq__av">ب</span>
          <div class="rv-grow" style="min-width: 0;"><a href="/admin/requests/RQ-2190" class="f-stretch b4-rq__t" style="display: block; color: inherit; text-decoration: none;">اصلاح و رنگ کامل</a><div class="b4-rq__s">بابک نادری<span class="rv-sep" aria-hidden="true"></span>چندخدمتی<span class="rv-sep" aria-hidden="true"></span>۲۰ مهر</div></div>
          <span class="rv-tag is-outline b4-rq__tag"><i class="ri ri-hourglass"></i>رد خودکار</span>
        </div>
      </div>
    </section>
    </div>
  </main>

  <!-- نوار پایین کارکنان (SHELL-STY) -->
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-current="page" aria-label="درخواست‌ها، ۴ درخواست منتظر پاسخ شما"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۴</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
</x-dc>

</body>
</html>
