<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-09 — جزئیات مشتری — زبانهٔ درخواست‌ها</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 908px;">
  <header class="f-bar-in">
    <a href="/admin/customers" class="rv-icon-btn" aria-label="بازگشت به مشتری‌ها"><i class="ri ri-arrow-right"></i></a>
    <h1>مشتری</h1>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
  </header>

  <main style="padding: var(--space-1) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-6);">
    <!-- [مدیر] همان کارت مشتری STY-CUS-D؛ سابقه نزد همه آرایشگران. رمز و روش‌های ورود مشتری نمایش داده نمی‌شوند -->
    <div style="display: flex; flex-direction: column; gap: var(--space-3);">
    <section class="b3-pf rv-glass-strong b4-cpf" aria-label="سامان نوری">
      <span class="b3-pf__ph"><img src="/_blob/073e8bab91cfbb056ea68d266d51cbe7" alt=""></span>
      <div class="rv-grow" style="min-width: 0;">
        <div class="b3-pf__n">سامان نوری</div>
        <div class="b3-pf__s"><bdi class="rv-ltr">۰۹۱۴ ۳۹۰ ۱۲۵۸</bdi></div>
        <div class="b4-cpf__since">۹ نوبت در سالن، از مرداد ۱۴۰۵</div>
      </div>
      <a href="tel:09143901258" class="rv-icon-btn" aria-label="تماس با سامان نوری"><i class="ri ri-phone"></i></a>
    </section>
    <div class="b3-acts">
      <a href="/admin/manual-booking?customer=1063" class="rv-btn rv-btn--primary"><i class="ri ri-sm ri-calendar-plus"></i>رزرو دستی برای او</a>
      <button type="button" class="rv-btn rv-btn--secondary" aria-haspopup="dialog"><i class="ri ri-sm ri-sms"></i>ارسال پیام</button>
    </div>
    <!-- [مدیر] اقدام‌های حساب زیر دکمه‌های رزرو دستی و پیام: ویرایش اطلاعات (برگه با تغییر عکس)، غیرفعال/فعال‌سازی، حذف؛ هر سه برگهٔ پایین باز می‌کنند -->
    <div class="b4-acc-acts" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2);">
      <button type="button" class="rv-btn rv-btn--secondary rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-edit"></i>ویرایش</button>
      <button type="button" class="rv-btn rv-btn--secondary rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-lock"></i>غیرفعال کردن</button>
      <button type="button" class="rv-btn rv-btn--danger-soft rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-trash"></i>حذف حساب</button>
    </div>
    </div>

    <!-- [مدیر] انتخاب‌گر دوحالته «خدمات / پرداخت‌ها» (رادیو؛ نه اسکرولی)؛ انتخاب‌شده سفید و بالاآمده با سایه، دیگری فرورفته (D10-152 سبک) — D10-176 -->
    <div class="b5-mode" role="radiogroup" aria-label="بخش نمایش‌داده‌شده"><button type="button" role="radio" id="mode-svc" aria-checked="true"><i class="ri ri-sm ri-calendar" aria-hidden="true"></i>خدمات</button><button type="button" role="radio" id="mode-pay" aria-checked="false"><i class="ri ri-sm ri-wallet" aria-hidden="true"></i>پرداخت‌ها</button></div>

    <!-- نوبت‌های پیش رو نزد همه آرایشگران: کارت تصویری (D10-42) + نشان نام آرایشگر (f-who) -->
        <!-- [مدیر] سه زبانهٔ خدمات: پیش رو / درخواست‌ها / گذشته (D10-130)؛ پرداخت‌ها در حالت جدا (D10-176) -->
    <div class="rv-seg rv-glass b4-seg-full is-3" role="tablist" aria-label="نوبت‌های مشتری"><button type="button" id="tab-up" role="tab" aria-selected="false" aria-controls="p-up">پیش رو<span class="b4-n" aria-label="۲ نوبت">۲</span></button><button type="button" id="tab-rq" role="tab" aria-selected="true" aria-controls="p-rq">درخواست‌ها<span class="b4-n" aria-label="۲ درخواست">۲</span></button><button type="button" id="tab-past" role="tab" aria-selected="false" aria-controls="p-past">گذشته<span class="b4-n" aria-label="۷ نوبت">۷</span></button></div>

    <section role="tabpanel" id="p-rq" aria-labelledby="tab-rq">
            <!-- منتظر پاسخ شما: کارت درخواست قطعی‌نشده با تایمر داخل کارت (مهلت ۷ روزه تا رد خودکار) -->
      <div class="b4-rqks" style="margin-bottom: var(--space-3);">
        <div class="b4-rqk">
          <article class="b2-c2 b4-rqk__c" aria-label="درخواست رنگ ریش، با امیر، منتظر پاسخ امیر، ۶ روز و ۲ ساعت تا رد خودکار">
            <div class="b4-rqk__main">
              <img class="b2-c2__img" src="/_blob/7ebf6fbc14eee9166ac8bda217dfa55e" alt="" style="object-position: center 30%;">
              <a href="/admin/requests/RQ-2226" class="b2-c2__hit" aria-label="رنگ ریش، منتظر پاسخ امیر"></a>
              <div class="b2-c2__txt">
                <span class="b2-c1__s b4-rqk__t">رنگ ریش</span>
                <span class="b4-rqk__pref">ثبت ۲۵ مهر</span>
                <span class="b4-rqk__pref">ترجیح: پنج‌شنبه ۷ آبان، ظهر</span>
                <span><span class="f-who">امیر</span></span>
              </div>
            </div>
            <div class="b4-rqk__due" role="timer">
              <div class="b4-rqk__row"><span><i class="ri ri-sm ri-hourglass" aria-hidden="true"></i>۶ روز و ۲ ساعت تا رد خودکار</span><small>شنبه ۲ آبان ۱۳:۴۰</small></div>
              <div class="b4-rqk__bar" aria-hidden="true"><i style="width: 87%;"></i></div>
            </div>
          </article>
        </div>
      </div>
      <div class="b4-cards">
            <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="درخواست RQ-2212، شنبه ۹ آبان ساعت ۱۰:۰۰، فیشیال، رزرو شد">
              <img class="b2-c2__img" src="/_blob/93897ddccfdc06e25d8a145ba1b7e82e" alt="" style="object-position: center 40%;">
              <a href="/admin/requests/RQ-2212" class="b2-c2__hit" aria-label="جزئیات نوبت شنبه ۹ آبان، ساعت ۱۰:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۹</b><span class="b2-c1__d">آبان، شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۰:۰۰</b></span></span>
                <span class="b2-c1__s">فیشیال</span>
                <span class="b4-c2__dur">ثبت درخواست ۲۴ مهر</span>
                <span><span class="f-who">سینا</span></span>
                <span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>درخواست رزرو شد</span>
              </div>
            </article></div>
      </div>
    </section>

  </main>

  <!-- نوار پایین مدیر کل = نوار آرایشگر (SHELL-ADM) -->
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-label="درخواست‌ها، ۴ درخواست منتظر پاسخ شما"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۴</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-current="page" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":908}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
