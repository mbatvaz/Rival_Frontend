<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-06 — برگه ارسال پیام (اعلان در سامانه)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 1060px;">
  <header class="f-bar-in">
    <a href="/admin/appointments" class="rv-icon-btn" aria-label="بازگشت به نوبت‌ها"><i class="ri ri-arrow-right"></i></a>
    <h1>جزئیات نوبت</h1>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
  </header>
  <div aria-hidden="true" inert>
  <div style="padding: var(--space-1) var(--space-4) 0; display: flex; flex-direction: column; gap: var(--space-6);">
    <article class="b3-rqh b3-lift" aria-label="نوبت اصلاح سر و صورت سامان نوری، یکشنبه ۲۶ مهر، امروز ساعت ۱۶:۰۰">
      <div class="b3-rqh__media" style="height: 160px;">
        <img src="/_blob/5f15cbdacebedd705fbeaf9cc91a9961" alt="" style="object-position: center 30%;">
        <div class="b3-rqh__tags"><span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span></div>
      </div>
      <div class="b3-rqh__panel rv-glass-strong b4-hpanel">
        <div class="rv-row" style="align-items: baseline; width: 100%;"><h2 style="margin: 0; font-size: 22px; line-height: 34px; font-weight: 600;">اصلاح سر و صورت</h2><bdi dir="ltr" class="b3-rq__s" style="margin-right: auto;">#BK-48306</bdi></div>
        <div class="rv-bk-hero__when">
          <div class="rv-bk-hero__date"><b>۲۶</b><span>یکشنبه</span><small>امروز</small></div>
          <span class="rv-bk-hero__sep" aria-hidden="true"></span>
          <div class="rv-bk-hero__time"><b>۱۶:۰۰</b><small>۱ ساعت<span class="rv-sep" aria-hidden="true"></span>۴ ساعت و ۲۰ دقیقه دیگر</small></div>
        </div>
        <div class="b4-cust">
          <span class="rv-avatar"><img src="/_blob/073e8bab91cfbb056ea68d266d51cbe7" alt=""></span>
          <div class="rv-grow" style="min-width: 0;">
            <a href="/admin/customers/1063" class="f-stretch b4-cust__n">سامان نوری</a>
            <span class="b4-cust__p">۰۹۱۴ ۳۹۰ ۱۲۵۸</span>
          </div>
          <button type="button" class="rv-icon-btn" aria-haspopup="dialog" aria-label="ارسال پیام به سامان نوری"><i class="ri ri-sms"></i></button>
          <a href="tel:09143901258" class="rv-icon-btn" aria-label="تماس با سامان نوری"><i class="ri ri-phone"></i></a>
        </div>
        <!-- [مدیر] آرایشگر این نوبت (همان ردیف b4-cust در ADM-04-P)؛ لمس، تقویم سالن با Scope همین آرایشگر -->
        <div class="b4-cust">
          <span class="rv-avatar">ا</span>
          <div class="rv-grow" style="min-width: 0;">
            <a href="/admin/calendar?scope=amir" class="f-stretch b4-cust__n">امیر</a>
            <span class="b4-cust__p" style="direction: rtl;">آرایشگر این نوبت</span>
          </div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i>
        </div>
      </div>
    </article>
  </div>
  </div>
  <div class="rv-scrim" aria-hidden="true"></div>
  <!-- برگه پیامک همان برگه جزئیات مشتری؛ کارت همین نوبت بالای پرده (D10-59)؛ فقط برای همین مشتری، شماره دلخواه وارد نمی‌شود -->
  <section class="rv-sheet rv-glass-strong b2-sheet" role="dialog" aria-modal="true" aria-labelledby="sm-t">
    <span class="b2-grip" aria-hidden="true"></span>
    <div class="b2-sheet__head">
      <span class="rv-tile is-ink"><i class="ri ri-bell"></i></span>
      <div class="rv-grow"><h2 id="sm-t" class="b2-sheet__t">ارسال پیام</h2><p class="b2-sheet__d">برای سامان نوری</p></div>
      <button type="button" class="rv-icon-btn rv-icon-btn--plain" aria-label="بستن برگه"><i class="ri ri-x"></i></button>
    </div>

    <!-- [مدیر] دو راه: پیامک، یا اعلان شخصی درون‌سامانه (فقط مدیر کل) -->
    <div class="rv-seg rv-glass b4-seg2" role="tablist" aria-label="راه ارسال">
      <button type="button" role="tab" aria-selected="false"><i class="ri ri-sm ri-sms"></i>پیامک</button>
      <button type="button" role="tab" aria-selected="true"><i class="ri ri-sm ri-bell"></i>اعلان در سامانه</button>
    </div>

    <fieldset class="b3-fs">
      <legend class="rv-label">متن آماده</legend>
      <div class="b3-rg" role="radiogroup" aria-label="متن آماده"><button class="rv-chip" type="button" role="radio" aria-checked="true">یادآوری نوبت امروز</button><button class="rv-chip" type="button" role="radio" aria-checked="false">چند دقیقه تأخیر داریم</button><button class="rv-chip" type="button" role="radio" aria-checked="false">لطفاً تماس بگیرید</button></div>
    </fieldset>

    <div class="rv-field">
      <label class="rv-label" for="sm-in">متن اعلان</label>
      <div class="rv-input b4-ta"><textarea id="sm-in" rows="4" aria-describedby="sm-h">سلام آقای نوری، یادآوری نوبت امروز شما ساعت ۱۶:۰۰ در آرایشگاه طاها. منتظرتان هستیم.</textarea></div>
      <div id="sm-h" class="rv-help b4-ta__h"><span>در اعلان‌های سامان نوری و بالای خانه‌اش نمایش داده می‌شود.</span></div>
    </div>

    <div class="b2-sheet__acts"><button type="button" class="rv-btn rv-btn--primary">ارسال اعلان</button><button type="button" class="rv-btn rv-btn--secondary">انصراف</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
