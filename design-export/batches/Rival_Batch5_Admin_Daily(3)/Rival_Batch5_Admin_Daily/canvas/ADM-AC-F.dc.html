<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-AC — مرکز اقدام — فیلتر نوع</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">

  <!-- نوار بالای صفحه داخلی (f-bar-in): بازگشت، عنوان با شمار باز، زنگ. بدون Scope -->
  <header class="f-bar-in">
    <a href="/admin" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>مرکز اقدام<span class="f-bar-in__sub">۳ مورد باز</span></h1>
    <a href="/admin/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>

  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <!-- فیلتر نوع: ریل chip (f-chiprail) تا نوع‌های آینده هم جا شوند؛ هر نوع یک گروه زیر هم -->
    <div class="f-chiprail b3-rg" role="radiogroup" aria-label="نوع مورد">
      <button type="button" class="rv-chip" role="radio" aria-checked="false">همه، ۳</button>
      <button type="button" class="rv-chip" role="radio" aria-checked="false">درخواست چندخدمتی، ۲</button>
      <button type="button" class="rv-chip" role="radio" aria-checked="true">پرداخت در حال بررسی، ۱</button>
    </div>

    <!-- فیلتر «پرداخت در حال بررسی»: فقط همین گروه؛ شمار باز در نوار بالا تغییر نمی‌کند -->
    <!-- گروه: پرداخت در حال بررسی. لمس کل کارت به جزئیات پرداخت (ADM-16، دسته ۷)؛ بدون دکمه -->
    <section aria-labelledby="g-pay">
      <div class="f-head"><h2 id="g-pay" class="f-h">پرداخت در حال بررسی</h2></div>
      <a href="/admin/payments/PAY-30418" class="rv-card rv-glass f-acp" style="color: inherit; text-decoration: none;" aria-label="پرداخت ۱۲۰٬۰۰۰ تومان علی محمدی، در حال بررسی از امروز ۰۹:۴۲">
        <span class="rv-tile rv-tile--sm is-plum"><i class="ri ri-sm ri-card"></i></span>
        <span class="rv-grow" style="min-width: 0;">
          <span style="display: block; font-size: 15px; line-height: 22px; font-weight: 600;">علی محمدی، ۱۲۰٬۰۰۰ تومان</span>
          <span class="f-t3" style="display: block; font-size: 12px; line-height: 18px;">نتیجه درگاه نامشخص<span class="rv-sep" aria-hidden="true"></span>از امروز ۰۹:۴۲<span class="rv-sep" aria-hidden="true"></span><span dir="ltr">#PAY-30418</span></span>
        </span>
        <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i>
      </a>
    </section>

    <p class="b4-hint"><i class="ri ri-info" aria-hidden="true"></i>فقط مواردی که اقدام مستقیم شما را لازم دارند اینجا هستند و پس از حل شدن خودکار می‌روند. شکست‌های عملیاتی در اعلان‌ها هستند.</p>
  </main>

  <!-- نوار پایین کارکنان: عیناً SHELL-STY؛ صفحه داخل کشو، پس «بیشتر» فعال -->
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-label="درخواست‌ها، ۴ درخواست منتظر پاسخ"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۴</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-current="page" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
