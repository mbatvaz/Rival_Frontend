<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ADM-09 — جزئیات مشتری — حالت پرداخت‌ها، Empty</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 918px;">
  <header class="f-bar-in">
    <a href="/admin/customers" class="rv-icon-btn" aria-label="بازگشت به مشتری‌ها"><i class="ri ri-arrow-right"></i></a>
    <h1>مشتری</h1>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
  </header>

  <main style="padding: var(--space-1) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-6);">
    <!-- [مدیر] همان کارت مشتری STY-CUS-D؛ سابقه نزد همه آرایشگران. رمز و روش‌های ورود مشتری نمایش داده نمی‌شوند -->
    <div style="display: flex; flex-direction: column; gap: var(--space-3);">
    <section class="b3-pf rv-glass-strong b4-cpf" aria-label="نیما یوسفی">
      <span class="b3-pf__ph"><img src="/_blob/8b4db4f0bb515d0663b480815b96a0f8" alt=""></span>
      <div class="rv-grow" style="min-width: 0;">
        <div class="b3-pf__n">نیما یوسفی</div>
        <div class="b3-pf__s"><bdi class="rv-ltr">۰۹۱۴ ۵۲۰ ۸۸۱۳</bdi></div>
        <div class="b4-cpf__since">۱ نوبت در سالن، از آبان ۱۴۰۵</div>
      </div>
      <a href="tel:09145208813" class="rv-icon-btn" aria-label="تماس با نیما یوسفی"><i class="ri ri-phone"></i></a>
    </section>
    <div class="b3-acts">
      <a href="/admin/manual-booking?customer=1063" class="rv-btn rv-btn--primary"><i class="ri ri-sm ri-calendar-plus"></i>رزرو دستی برای او</a>
      <button type="button" class="rv-btn rv-btn--secondary" aria-haspopup="dialog"><i class="ri ri-sm ri-sms"></i>ارسال پیام</button>
    </div>
    <!-- [مدیر] اقدام‌های حساب زیر دکمه‌های رزرو دستی و پیام: ویرایش اطلاعات (برگه با تغییر عکس)، غیرفعال/فعال‌سازی، حذف؛ هر سه برگهٔ پایین باز می‌کنند -->
    <div class="b4-acc-acts" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2);">
      <button type="button" class="rv-btn rv-btn--secondary rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-edit"></i>ویرایش</button>
      <button type="button" class="rv-btn rv-btn--secondary rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-lock"></i>غیرفعال کردن</button>
      <button type="button" class="rv-btn rv-btn--danger-soft rv-btn--sm" style="min-height: 44px; padding-inline: var(--space-2);" aria-haspopup="dialog"><i class="ri ri-sm ri-trash"></i>حذف حساب</button>
    </div>
    </div>

    <!-- [مدیر] انتخاب‌گر دوحالته «خدمات / پرداخت‌ها» (رادیو؛ نه اسکرولی)؛ انتخاب‌شده سفید و بالاآمده با سایه، دیگری فرورفته (D10-152 سبک) — D10-176 -->
    <div class="b5-mode" role="radiogroup" aria-label="بخش نمایش‌داده‌شده"><button type="button" role="radio" id="mode-svc" aria-checked="false"><i class="ri ri-sm ri-calendar" aria-hidden="true"></i>خدمات</button><button type="button" role="radio" id="mode-pay" aria-checked="true"><i class="ri ri-sm ri-wallet" aria-hidden="true"></i>پرداخت‌ها</button></div>

    <!-- [مدیر] موجودی اعتبار فقط در حالت «پرداخت‌ها»؛ دکمهٔ «تغییر موجودی» برگهٔ اصلاح موجودی را باز می‌کند (برگه در دسته ۷؛ D10-171) -->
    <section class="b5-balc rv-glass-strong" aria-label="موجودی اعتبار"><span class="b5-balc__ic" aria-hidden="true"><i class="ri ri-lg ri-wallet"></i></span><div class="rv-grow" style="min-width:0;"><div class="b5-balc__l">موجودی اعتبار</div><div class="b5-balc__v">۰<small>تومان</small></div></div><button type="button" class="rv-btn rv-btn--secondary rv-btn--sm" aria-haspopup="dialog" aria-label="تغییر موجودی اعتبار"><i class="ri ri-sm ri-edit"></i>تغییر موجودی</button></section>

    <section role="tabpanel" id="p-pay" aria-labelledby="mode-pay" style="display: flex; flex-direction: column; gap: var(--space-4);">
      <!-- [مدیر] دو نما: پرداخت‌ها (پیش‌فرض) و حرکت‌های اعتبار (دفتر تغییرناپذیر) -->
      <div class="rv-seg rv-glass b4-seg-full" role="tablist" aria-label="نمای زبانهٔ پرداخت‌ها"><button type="button" id="pv-pay" role="tab" aria-selected="true" aria-controls="pv-pay-p">پرداخت‌ها</button><button type="button" id="pv-led" role="tab" aria-selected="false" aria-controls="pv-led-p">حرکت‌های اعتبار</button></div>
      <div class="b3-empty rv-glass" role="status">
        <span class="b3-empty__ic" aria-hidden="true"><i class="ri ri-lg ri-receipt"></i></span>
        <h2 class="b3-empty__t">پرداختی ثبت نشده</h2>
        <p class="b3-empty__d">پرداخت‌های این مشتری و حرکت‌های اعتبارش اینجا نشان داده می‌شود.</p>
      </div>
    </section>

  </main>

  <!-- نوار پایین مدیر کل = نوار آرایشگر (SHELL-ADM) -->
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-label="درخواست‌ها، ۴ درخواست منتظر پاسخ شما"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۴</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-current="page" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":918}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
