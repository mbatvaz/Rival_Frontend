<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>SYS-OFFLINE — خطای شبکه — تمام‌صفحه، در حال تلاش</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
<link rel="stylesheet" href="rv-b6.css">
<link rel="stylesheet" href="rv-b7.css">

<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>اتصال</h1>
    <span aria-hidden="true"></span>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column;">
    <section class="b2-res" aria-labelledby="st-t">
      <span class="rv-tile rv-tile--xl is-info"><i class="ri ri-xl ri-refresh"></i></span>
      <span class="rv-tag is-info"><i class="ri ri-hourglass"></i>در حال اتصال</span>
      <h2 id="st-t" class="b2-res__t">در حال تلاش برای اتصال</h2>
      <ul class="b2-res__steps">
        <li><i class="ri ri-info"></i><span><b>چه شد:</b> صفحه بارگذاری نشد.</span></li>
        <li><i class="ri ri-shield"></i><span><b>اثرش:</b> تغییری ذخیره و پرداختی انجام نشده است. اگر پرداخت در جریان بود، نتیجه‌اش بعداً اعلام می‌شود.</span></li>
        <li><i class="ri ri-refresh"></i><span><b>قدم بعد:</b> اتصال اینترنت را بررسی کنید و دوباره امتحان کنید.</span></li>
      </ul>
      <button type="button" class="rv-btn rv-btn--primary rv-btn--block b2-res__act is-loading" aria-busy="true" disabled>تلاش دوباره</button>
    </section>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
