<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>SYS-OFFLINE — خطای شبکه — Toast</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
<link rel="stylesheet" href="rv-b6.css">
<link rel="stylesheet" href="rv-b7.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نوبت‌های من</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها"><i class="ri ri-bell"></i></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="b3-tools"><span class="b3-tools__sum"><b>۳</b> نوبت</span><button type="button" class="rv-btn rv-btn--secondary rv-btn--sm b3-filter-btn" aria-haspopup="dialog" aria-label="فیلتر نوبت‌ها"><i class="ri ri-sm ri-filter"></i>فیلتر</button></div>
    <div class="rv-list rv-glass"><div class="rv-item"><span class="b7-th" aria-hidden="true" style="border-radius: var(--radius-sm);"><img src="/_blob/5c36e6a56b1c56a9962cce42693c2464" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: center 35%;"></span><div class="rv-grow" style="min-width: 0;"><div class="rv-item__t">اصلاح سر و صورت</div><div class="rv-item__s">سه‌شنبه ۱۲ آبان، ۱۶:۰۰<span class="rv-sep" aria-hidden="true"></span>امیر</div></div><div class="rv-item__end"><span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span></div></div><div class="rv-item"><span class="b7-th" aria-hidden="true" style="border-radius: var(--radius-sm);"><img src="/_blob/ec744f49eed46d82195e460f3b82e2c4" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: center 35%;"></span><div class="rv-grow" style="min-width: 0;"><div class="rv-item__t">اصلاح ریش</div><div class="rv-item__s">شنبه ۱۶ آبان، ۱۱:۰۰<span class="rv-sep" aria-hidden="true"></span>سینا</div></div><div class="rv-item__end"><span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span></div></div><div class="rv-item"><span class="b7-th" aria-hidden="true" style="border-radius: var(--radius-sm);"><img src="/_blob/5c36e6a56b1c56a9962cce42693c2464" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: center 35%; filter: grayscale(1);"></span><div class="rv-grow" style="min-width: 0;"><div class="rv-item__t">اصلاح سر</div><div class="rv-item__s">شنبه ۲۵ مهر، ۱۰:۳۰<span class="rv-sep" aria-hidden="true"></span>مهدی</div></div><div class="rv-item__end"><span class="rv-tag is-success"><i class="ri ri-check"></i>انجام شده</span></div></div></div>
  </main>
  <!-- SYS-OFFLINE: Toast بالای صفحه با «تلاش دوباره»؛ تن warning چون اقدام کاربر لازم است؛ صفحه زیر آن سالم می‌ماند -->
  <div class="b4-toastwrap" role="alert">
    <div class="rv-toast">
      <span class="rv-ic is-warning"><i class="ri ri-sm ri-alert"></i></span>
      <div class="rv-grow"><div class="rv-toast__t">اتصال برقرار نیست</div><div class="rv-toast__d">تغییری ذخیره نشد. اینترنت را بررسی کنید.</div></div>
      <button type="button" class="rv-btn rv-btn--secondary rv-btn--sm"><i class="ri ri-sm ri-refresh"></i>تلاش دوباره</button>
    </div>
  </div>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
