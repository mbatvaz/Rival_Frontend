<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="ds/rival/tokens.css">

<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>دسترسی محدود</h1>
    <a href="/admin/action-center" class="rv-icon-btn" aria-label="مرکز اقدام، ۳ مورد باز"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column;">
    <!-- STATE-01 مدیر: فقط مسیرهای مخصوص حساب مشتری (مثل پیوند پیامک مشتری) برای مدیر بسته است -->
    <section class="b2-res" aria-labelledby="st-t">
      <span class="rv-tile rv-tile--xl"><i class="ri ri-xl ri-lock"></i></span>
      <h2 id="st-t" class="b2-res__t">این صفحه مخصوص حساب مشتری است</h2>
      <p class="b2-res__d">همین مورد را می‌توانید از پنل خودتان پیدا کنید: نوبت‌ها و درخواست‌ها با جست‌وجوی کد پیگیری، و مشتری از تب «مشتری‌ها».</p>
      <a href="/admin" class="rv-btn rv-btn--primary rv-btn--block b2-res__act">بازگشت به صفحهٔ اصلی من</a>
    </section>
  </main>
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مدیر کل">
      <a href="/admin" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/admin/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/admin/requests" aria-label="درخواست‌ها، ۲ درخواست منتظر پاسخ شما"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۲</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/admin/customers" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
