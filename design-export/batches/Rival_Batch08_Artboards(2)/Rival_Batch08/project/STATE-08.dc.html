<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>ریوال</h1>
    <span aria-hidden="true"></span>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column;">
    <!-- STATE-08: فقط راهنما (فاز ۴)؛ بدون نوار پایین؛ پیوند ساده که بی‌جاوااسکریپت هم کار می‌کند؛ تن warning چون اقدام کاربر لازم است -->
    <section class="b2-res" aria-labelledby="st-t">
      <span class="rv-tile rv-tile--xl is-warning"><i class="ri ri-xl ri-settings"></i></span>
      <h2 id="st-t" class="b2-res__t">برای ادامه، جاوااسکریپت را روشن کنید</h2>

      <ol class="b2-res__steps" style="padding: 0;">
        <li><i class="ri ri-settings"></i><span>در مرورگر، <b>تنظیمات سایت</b> را باز کنید.</span></li>
        <li><i class="ri ri-check"></i><span><b>جاوااسکریپت</b> را برای این سایت مجاز کنید.</span></li>
        <li><i class="ri ri-refresh"></i><span>صفحه را دوباره باز کنید.</span></li>
      </ol>
      <a href="./" class="rv-btn rv-btn--primary rv-btn--block b2-res__act">بارگذاری دوباره صفحه</a>
    </section>
  </main>
