  <main style="padding: var(--space-4) var(--space-4) var(--space-8); display: flex; flex-direction: column; gap: var(--space-6);">

    <section aria-labelledby="hrs" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="hrs" class="f-h">ساعات کاری</h2></div>
      <div class="rv-card rv-glass" style="display: flex; flex-direction: column; gap: var(--space-2);">

        <div class="rv-kv"><span>جمعه</span><b>تعطیل</b></div>
      </div>
    </section>
    <section aria-labelledby="loc" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="loc" class="f-h">نشانی و تماس</h2></div>
      <div class="rv-card rv-glass" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="b7-map" style="height: 168px; margin: 0;" role="img" aria-label="نقشه الان نمایش داده نمی‌شود">

            <span class="rv-tile"><i class="ri ri-map-pin"></i></span>
            <span style="font-size: 14px; line-height: 22px; font-weight: 400; color: var(--text-primary);">نقشه الان بار نمی‌شود</span>
            <span style="font-size: 12px; line-height: 18px; font-weight: 300; color: var(--text-secondary);">نشانی زیر کامل است؛ برای مسیریابی آن را در برنامهٔ نقشهٔ گوشی باز کنید.</span>
          </span>
        </div>
        <div class="rv-row" style="gap: var(--space-3); align-items: flex-start;">
          <span class="rv-tile rv-tile--sm" aria-hidden="true"><i class="ri ri-sm ri-map-pin"></i></span>
          <div class="rv-grow"><div style="font-size: 15px; line-height: 24px;">اردبیل، خیابان امام، کوچهٔ [نام کوچه]، پلاک [شماره]</div><div class="rv-caption rv-muted">نزدیک [نشانهٔ نزدیک]</div></div>
        </div>
        <a href="tel:+984533000000" class="rv-row" style="gap: var(--space-3); align-items: center; min-height: 44px; color: inherit; text-decoration: none;">
          <span class="rv-tile rv-tile--sm" aria-hidden="true"><i class="ri ri-sm ri-phone"></i></span>
          <span class="rv-grow"><bdi dir="ltr" style="font-size: 15px;">045 3300 0000</bdi></span>
