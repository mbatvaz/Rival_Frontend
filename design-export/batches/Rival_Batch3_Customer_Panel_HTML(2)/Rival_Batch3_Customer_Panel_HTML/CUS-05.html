<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{background:#d7d9dd}body{margin:0}body>.rv-board{margin:0 auto}</style>
<title>CUS-05 — درخواست‌های من — در انتظار پرداخت (Default)</title>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>درخواست‌ها</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b3-tabrow">
      <div class="rv-seg rv-glass b3-seg-full is-3" role="tablist" aria-label="وضعیت درخواست‌ها">
        <button type="button" id="t-pay" role="tab" aria-selected="true" aria-controls="p-pay">پرداخت<span class="b3-n" aria-label="۲ درخواست در انتظار پرداخت">۲</span></button>
        <button type="button" id="t-wait" role="tab" aria-selected="false" aria-controls="p-wait">پاسخ<span class="b3-n" aria-label="۲ درخواست در انتظار پاسخ">۲</span></button>
        <button type="button" id="t-done" role="tab" aria-selected="false" aria-controls="p-done">تکمیل شده<span class="b3-n" aria-label="۵ درخواست تکمیل‌شده">۵</span></button>
      </div>
      <div class="rv-card rv-glass b3-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b3-fcard__b" aria-haspopup="dialog" aria-label="فیلتر درخواست‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <section id="p-pay" role="tabpanel" aria-labelledby="t-pay">
      <div class="f-head"><h2 class="f-h">در انتظار پرداخت</h2><span class="rv-caption rv-muted">زمان‌ها نگه داشته شده‌اند</span></div>
      <div class="b3-rql">
        <div class="b3-rqpay">
          <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="پکیج دامادی، در انتظار پرداخت، ۱ ساعت و ۳۴ دقیقه تا آزاد شدن زمان‌ها">
            <img class="b2-c2__img" src="assets/59ecd8cd23417459d737dad2bd891d3f.png" alt="" style="object-position: center 30%;">
            <a href="/customer/requests/RQ-2207" class="b2-c2__hit" aria-label="جزئیات درخواست پکیج دامادی"></a>
            <div class="b2-c2__txt">
              <span class="b2-c2__when"><b class="b2-c1__t">۲۳</b><span class="b2-c1__d">مهر</span></span>
              <span class="b2-c1__s">پکیج دامادی</span>
              <span class="b2-c2__who"><span>۳ بخش، از دوشنبه ۲۷ مهر</span></span>
              <span class="rv-tag is-warning"><i class="ri ri-hourglass"></i>در انتظار پرداخت</span>
            </div>
          </article></div>
          <div class="b3-rqpay__hold" role="timer" aria-label="۱ ساعت و ۳۴ دقیقه تا آزاد شدن زمان‌ها">
            <div class="rv-between" style="align-items: center;"><span class="f-bar__txt"><b>۱:۳۴</b> تا آزاد شدن زمان‌ها</span><span class="f-bar__txt">هزینه رزرو <b style="font-size: 15px;">۴۹۰٬۰۰۰</b> تومان</span></div>
            <div class="f-bar__track" aria-hidden="true" style="margin-top: var(--space-2);"><i style="width: 52%;"></i></div>
          </div>
        </div>
        <div class="b3-rqpay">
          <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="فیشیال، در انتظار پرداخت، ۲ ساعت و ۴۱ دقیقه تا آزاد شدن زمان">
            <img class="b2-c2__img" src="assets/90115837df8d77a59655b3ba95cf13ff.png" alt="" style="object-position: center 40%;">
            <a href="/customer/requests/RQ-2210" class="b2-c2__hit" aria-label="جزئیات درخواست فیشیال"></a>
            <div class="b2-c2__txt">
              <span class="b2-c2__when"><b class="b2-c1__t">۲۳</b><span class="b2-c1__d">مهر</span></span>
              <span class="b2-c1__s">فیشیال</span>
              <span class="b2-c2__who"><span>با سینا، ۲۶ مهر، ۱۲:۰۰</span></span>
              <span class="rv-tag is-warning"><i class="ri ri-hourglass"></i>در انتظار پرداخت</span>
            </div>
          </article></div>
          <div class="b3-rqpay__hold" role="timer" aria-label="۲ ساعت و ۴۱ دقیقه تا آزاد شدن زمان">
            <div class="rv-between" style="align-items: center;"><span class="f-bar__txt"><b>۲:۴۱</b> تا آزاد شدن زمان</span><span class="f-bar__txt">هزینه رزرو <b style="font-size: 15px;">۲۵۰٬۰۰۰</b> تومان</span></div>
            <div class="f-bar__track" aria-hidden="true" style="margin-top: var(--space-2);"><i style="width: 90%;"></i></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-current="page" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</body>
</html>
