<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{background:#d7d9dd}body{margin:0}body>.rv-board{margin:0 auto}</style>
<title>CUS-06 — جزئیات درخواست — پیشنهادی در انتظار پرداخت</title>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/requests" class="rv-icon-btn" aria-label="بازگشت به درخواست‌ها"><i class="ri ri-arrow-right"></i></a>
    <h1>جزئیات درخواست</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-1) var(--space-4) 196px; display: flex; flex-direction: column; gap: var(--space-5);">
    <article class="b3-rqh" aria-label="فیشیال با سینا، در انتظار پرداخت">
      <div class="b3-rqh__media">
        <img src="assets/90115837df8d77a59655b3ba95cf13ff.png" alt="" style="object-position: center 40%;">
        <div class="b3-rqh__tags"><span class="rv-tag is-warning"><i class="ri ri-hourglass"></i>در انتظار پرداخت</span></div>
      </div>
      <div class="b3-rqh__panel rv-glass-strong">
        <h2 style="margin: 0; font-size: 22px; line-height: 34px; font-weight: 600;">فیشیال</h2>
        <div class="b3-rq__s" style="white-space: nowrap;">با سینا<span class="rv-sep" aria-hidden="true"></span><bdi dir="ltr">#RQ-2210</bdi></div>
      </div>
    </article>
    <section aria-labelledby="p-ans" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="f-head" style="margin-bottom: 0;"><h3 id="p-ans" class="f-h">پاسخ سینا</h3></div>
      <div class="rv-card rv-glass b3-ans">
        <div class="rv-bk-hero__when" style="margin-top: 0;">
          <div class="rv-bk-hero__date"><b>۲۶</b><span>یکشنبه</span><small>مهر</small></div>
          <span class="rv-bk-hero__sep" aria-hidden="true"></span>
          <div class="rv-bk-hero__time"><b>۱۲:۰۰</b><small>ترجیح شما: یکشنبه، ظهر</small></div>
        </div>
        <div class="b3-ans__who"><span class="rv-avatar rv-avatar--sm"><img src="assets/bd5966bca0239b5b2db570699eedbbb4.png" alt=""></span><span>پیشنهاد سینا</span></div>
      </div>
      <div style="padding: 0 var(--space-1);">
        <div class="rv-kv"><span>هزینه رزرو</span><b>۲۵۰٬۰۰۰ تومان</b></div>
        <div class="rv-kv b2-credit"><span>از اعتبار شما</span><b><bdi dir="ltr">−۶۰٬۰۰۰</bdi> تومان</b></div>
        <p class="b2-rules" style="margin: var(--space-2) 0 0;"><i class="ri ri-sm ri-shield" style="color: var(--text-muted);"></i>پرداخت یعنی پذیرش قوانین رزرو. <a class="rv-link" href="/booking-rules">قوانین رزرو</a></p>
      </div>
    </section>
  </main>

  <div class="b3-bar2 rv-glass-strong">
    <div role="timer" aria-label="۲ ساعت و ۴۱ دقیقه تا آزاد شدن زمان">
      <div class="rv-between" style="align-items: center;"><span class="f-bar__txt"><b>۲:۴۱</b> تا آزاد شدن زمان</span><span class="f-bar__txt">مانده برای درگاه <b style="font-size: 15px;">۱۹۰٬۰۰۰</b> تومان</span></div>
      <div class="f-bar__track" aria-hidden="true" style="margin-top: var(--space-2);"><i style="width: 90%;"></i></div>
    </div>
    <div class="b3-bar2__acts">
      <button type="button" class="rv-btn rv-btn--secondary" aria-haspopup="dialog">لغو درخواست</button>
      <a href="#gateway" class="rv-btn rv-btn--accent">پرداخت و قطعی کردن</a>
    </div>
  </div>
</div>
</body>
</html>
