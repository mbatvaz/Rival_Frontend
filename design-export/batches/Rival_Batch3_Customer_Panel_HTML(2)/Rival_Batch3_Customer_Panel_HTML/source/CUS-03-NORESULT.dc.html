<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>CUS-03 — نوبت‌های من — نتیجه خالی فیلتر</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نوبت‌های من</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b3-tabrow">
      <div class="rv-seg rv-glass b3-seg-full" role="tablist" aria-label="نوبت‌های من">
        <button type="button" id="t-up" role="tab" aria-selected="false" aria-controls="p-up">پیش رو<span class="b3-n" aria-label="۳ نوبت پیش رو">۳</span></button>
        <button type="button" id="t-past" role="tab" aria-selected="true" aria-controls="p-past">گذشته<span class="b3-n" aria-label="۵ نوبت گذشته">۵</span></button>
      </div>
      <div class="rv-card rv-glass b3-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b3-fcard__b" aria-haspopup="dialog" aria-label="فیلتر نوبت‌ها، ۳ فیلتر فعال"><i class="ri ri-sm ri-filter"></i></button><span class="rv-count">۳</span></div>
    </div>
    <div class="rv-row rv-wrap" style="gap: var(--space-2);">
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف فیلتر عدم حضور">عدم حضور<i class="ri ri-x"></i></button>
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف فیلتر سینا" style="padding-inline-start: 4px;"><span class="rv-avatar rv-avatar--xs" style="width: 28px; height: 28px;"><img src="/_blob/bd5966bca0239b5b2db570699eedbbb4" alt=""></span>سینا<i class="ri ri-x"></i></button>
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف فیلتر ۳۰ روز اخیر">۳۰ روز اخیر<i class="ri ri-x"></i></button>
    </div>
    <div id="p-past" role="tabpanel" aria-labelledby="t-past">
      <div class="b3-empty" role="status">
        <span class="b3-empty__ic" aria-hidden="true"><i class="ri ri-filter"></i></span>
        <h2 class="b3-empty__t">نوبتی با این فیلترها نیست</h2>
        <p class="b3-empty__d">یکی از فیلترها را بردارید یا همه را پاک کنید.</p>
        <button type="button" class="rv-btn rv-btn--secondary">پاک کردن فیلترها</button>
      </div>
    </div>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-current="page" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
