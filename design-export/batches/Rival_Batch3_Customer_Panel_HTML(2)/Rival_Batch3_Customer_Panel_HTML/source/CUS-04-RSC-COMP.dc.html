    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">

      <span class="b2-ctx__media"><img src="/_blob/7c4f31dfbf051a4d393c8081487798e2" alt="" style="object-position: center 28%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">اصلاح سر</div><div class="b2-ctx__s"><span class="rv-avatar"><img src="/_blob/bd5966bca0239b5b2db570699eedbbb4" alt=""></span>با سینا</div><div class="b3-cur"><i class="ri ri-sm ri-calendar-clock" aria-hidden="true"></i>نوبت فعلی: امروز، ۱۹:۰۰</div></div>

    <p class="b2-note" style="margin-top: calc(var(--space-2) * -1); color: var(--text-secondary);"><i class="ri ri-refresh"></i><span>با حق جبرانی: سهم جابه‌جایی خودتان مصرف نمی‌شود و حق بازگشت هزینه می‌ماند.</span></p>
    <section aria-labelledby="f-day" style="display: flex; flex-direction: column; gap: var(--space-3);">

          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="جمعه ۲۴ مهر، سالن تعطیل است"><small>ج</small><b>۲۴</b></button>

          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="جمعه ۱ آبان، سالن تعطیل است"><small>ج</small><b>۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="شنبه ۲ آبان"><small>ش</small><b>۲</b></button>

      <div class="b2-slots4" role="group" aria-label="زمان‌های آزاد یکشنبه ۲۶ مهر">

        <button type="button" class="rv-slot" aria-pressed="false">۱۰:۰۰</button>

    <div class="b2-bar__sum"><span class="b2-bar__t">یکشنبه ۲۶ مهر، ۱۰:۳۰</span><span class="b2-bar__s">به‌جای امروز، ۱۹:۰۰</span></div>

  </div>
</div>
