<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>CUS-05 — درخواست‌های من — تکمیل شده</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 900px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>درخواست‌ها</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b3-tabrow">
      <div class="rv-seg rv-glass b3-seg-full is-3" role="tablist" aria-label="وضعیت درخواست‌ها">
        <button type="button" id="t-pay" role="tab" aria-selected="false" aria-controls="p-pay">پرداخت<span class="b3-n" aria-label="۲ درخواست در انتظار پرداخت">۲</span></button>
        <button type="button" id="t-wait" role="tab" aria-selected="false" aria-controls="p-wait">پاسخ<span class="b3-n" aria-label="۲ درخواست در انتظار پاسخ">۲</span></button>
        <button type="button" id="t-done" role="tab" aria-selected="true" aria-controls="p-done">تکمیل شده<span class="b3-n" aria-label="۵ درخواست تکمیل‌شده">۵</span></button>
      </div>
      <div class="rv-card rv-glass b3-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b3-fcard__b" aria-haspopup="dialog" aria-label="فیلتر درخواست‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <section id="p-done" role="tabpanel" aria-labelledby="t-done" class="b3-past">
      <div class="f-head"><h2 class="f-h">تکمیل شده</h2><span class="rv-caption rv-muted">۵ درخواست</span></div>
      <div class="rv-list rv-glass">
        <a class="rv-item" href="/customer/requests/RQ-2194" aria-label="پکیج آراستگی، ۲ بخش، ۲۰ مهر">
          <img class="b3-past__img" src="/_blob/59ecd8cd23417459d737dad2bd891d3f" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">پکیج آراستگی</div><div class="b3-past__s">۲ بخش</div><span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۲۰</span><span class="b3-past__date">مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item" href="/customer/requests/RQ-2186" aria-label="فیشیال، با سینا، ۱۹ مهر">
          <img class="b3-past__img" src="/_blob/90115837df8d77a59655b3ba95cf13ff" alt="" style="object-position: center 40%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">فیشیال</div><div class="b3-past__s">با سینا</div><span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۹</span><span class="b3-past__date">مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item is-cancel" href="/customer/requests/RQ-2171" aria-label="رنگ ریش، با امیر، ۱۰ مهر">
          <img class="b3-past__img" src="/_blob/d17a436f28cd58a1594e31dbed06e06e" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">رنگ ریش</div><div class="b3-past__s">با امیر</div><span class="rv-tag"><i class="ri ri-ban"></i>رد شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۰</span><span class="b3-past__date">مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item is-cancel" href="/customer/requests/RQ-2152" aria-label="پکیج دامادی، ۳ بخش، ۸ مهر">
          <img class="b3-past__img" src="/_blob/59ecd8cd23417459d737dad2bd891d3f" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">پکیج دامادی</div><div class="b3-past__s">۳ بخش</div><span class="rv-tag"><i class="ri ri-timer"></i>منقضی شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۸</span><span class="b3-past__date">مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item is-cancel" href="/customer/requests/RQ-2160" aria-label="فیشیال، با سینا، ۶ مهر">
          <img class="b3-past__img" src="/_blob/90115837df8d77a59655b3ba95cf13ff" alt="" style="object-position: center 40%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">فیشیال</div><div class="b3-past__s">با سینا</div><span class="rv-tag is-rose"><i class="ri ri-x-circle"></i>لغو شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۶</span><span class="b3-past__date">مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
      </div>
    </section>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-current="page" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>

  renderVals() { return {}; }

</body>
</html>
