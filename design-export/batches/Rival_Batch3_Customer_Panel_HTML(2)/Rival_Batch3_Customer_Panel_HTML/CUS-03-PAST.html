<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{background:#d7d9dd}body{margin:0}body>.rv-board{margin:0 auto}</style>
<title>CUS-03 — نوبت‌های من — گذشته</title>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 900px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نوبت‌های من</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b3-tabrow">
      <div class="rv-seg rv-glass b3-seg-full" role="tablist" aria-label="نوبت‌های من">
        <button type="button" id="t-up" role="tab" aria-selected="false" aria-controls="p-up">پیش رو<span class="b3-n" aria-label="۳ نوبت پیش رو">۳</span></button>
        <button type="button" id="t-past" role="tab" aria-selected="true" aria-controls="p-past">گذشته<span class="b3-n" aria-label="۵ نوبت گذشته">۵</span></button>
      </div>
      <div class="rv-card rv-glass b3-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b3-fcard__b" aria-haspopup="dialog" aria-label="فیلتر نوبت‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <div id="p-past" role="tabpanel" aria-labelledby="t-past" class="b3-past" style="display: flex; flex-direction: column; gap: var(--space-5);">
      <section aria-labelledby="m-mehr">
        <h2 id="m-mehr" class="b3-mlbl">مهر</h2>
        <div class="rv-list rv-glass">
        <a class="rv-item" href="/customer/appointments/BK-47920" aria-label="۱۴ مهر، ۱۷:۰۰، اصلاح سر و صورت با امیر، انجام شده">
          <img class="b3-past__img" src="assets/d04f18af2d8a0b3f03a5f361196f7110.png" alt="" style="object-position: center 35%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">اصلاح سر و صورت</div><div class="b3-past__s">با امیر</div><span class="rv-tag is-success"><i class="ri ri-check-circle"></i>انجام شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۷:۰۰</span><span class="b3-past__date">۱۴ مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item is-cancel" href="/customer/appointments/BK-47811" aria-label="۵ مهر، ۱۰:۰۰، فیشیال با سینا، لغو شده توسط شما">
          <img class="b3-past__img" src="assets/90115837df8d77a59655b3ba95cf13ff.png" alt="" style="object-position: center 40%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">فیشیال</div><div class="b3-past__s">با سینا</div><span class="rv-tag is-rose"><i class="ri ri-x-circle"></i>لغو شده توسط شما</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۰:۰۰</span><span class="b3-past__date">۵ مهر</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        </div>
      </section>
      <section aria-labelledby="m-shahr">
        <h2 id="m-shahr" class="b3-mlbl">شهریور</h2>
        <div class="rv-list rv-glass">
        <a class="rv-item" href="/customer/appointments/BK-47603" aria-label="۲۵ شهریور، ۱۸:۰۰، اصلاح سر با طاها، عدم حضور">
          <img class="b3-past__img" src="assets/7c4f31dfbf051a4d393c8081487798e2.png" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">اصلاح سر</div><div class="b3-past__s">با طاها</div><span class="rv-tag is-danger"><i class="ri ri-ban"></i>عدم حضور</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۸:۰۰</span><span class="b3-past__date">۲۵ شهریور</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item" href="/customer/appointments/BK-47455" aria-label="۱۲ شهریور، ۱۶:۰۰، رنگ ریش با امیر، انجام شده">
          <img class="b3-past__img" src="assets/d17a436f28cd58a1594e31dbed06e06e.png" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">رنگ ریش</div><div class="b3-past__s">با امیر</div><span class="rv-tag is-success"><i class="ri ri-check-circle"></i>انجام شده</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۶:۰۰</span><span class="b3-past__date">۱۲ شهریور</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        <a class="rv-item is-cancel" href="/customer/appointments/BK-47388" aria-label="۳ شهریور، ۱۱:۳۰، اصلاح سر با سینا، لغو شده توسط سالن">
          <img class="b3-past__img" src="assets/7c4f31dfbf051a4d393c8081487798e2.png" alt="" style="object-position: center 30%;">
          <div class="rv-grow" style="min-width: 0;"><div class="b3-past__t">اصلاح سر</div><div class="b3-past__s">با سینا</div><span class="rv-tag is-rose"><i class="ri ri-x-circle"></i>لغو شده توسط سالن</span></div>
          <div class="b3-past__when"><span class="b3-past__time">۱۱:۳۰</span><span class="b3-past__date">۳ شهریور</span></div>
          <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true" style="flex: none; color: var(--text-muted);"></i>
        </a>
        </div>
      </section>
    </div>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-current="page" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</body>
</html>
