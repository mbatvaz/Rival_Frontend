<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{background:#d7d9dd}body{margin:0}body>.rv-board{margin:0 auto}</style>
<title>CUS-06 — جزئیات درخواست — منقضی شده</title>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 960px;">
  <header class="f-bar-in">
    <a href="/customer/requests" class="rv-icon-btn" aria-label="بازگشت به درخواست‌ها"><i class="ri ri-arrow-right"></i></a>
    <h1>جزئیات درخواست</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-1) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <article class="b3-rqh b3-hero-off" aria-label="پکیج دامادی، منقضی شده">
      <div class="b3-rqh__media">
        <img src="assets/59ecd8cd23417459d737dad2bd891d3f.png" alt="" style="filter: grayscale(1); opacity: .85; object-position: center 30%;">
        <div class="b3-rqh__tags"><span class="rv-tag"><i class="ri ri-timer"></i>منقضی شده</span></div>
      </div>
      <div class="b3-rqh__panel rv-glass-strong">
        <h2 style="margin: 0; font-size: 22px; line-height: 34px; font-weight: 600;">پکیج دامادی</h2>
        <div class="b3-rq__s" style="white-space: nowrap;">۳ بخش<span class="rv-sep" aria-hidden="true"></span><bdi dir="ltr">#RQ-2152</bdi></div>
      </div>
    </article>
    <div class="rv-notice" role="status">
      <i class="ri ri-timer"></i>
      <div class="rv-grow"><div class="rv-notice__t">مهلت پرداخت تمام شد</div><div class="rv-notice__d">مهلت ۳ ساعته پرداخت شنبه ۱۸ مهر، ۲۲:۴۰ تمام شد و هر سه زمان آزاد شدند. مبلغی پرداخت نشده بود.</div></div>
    </div>
    <section aria-labelledby="ex-parts" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="f-head" style="margin-bottom: 0;"><h3 id="ex-parts" class="f-h">بخش‌های پکیج</h3></div>
      <div role="list" aria-label="بخش‌های پکیج" style="display: flex; flex-direction: column; gap: var(--space-3);">
        <article role="listitem" class="b2-c2" style="min-height: 88px;" aria-label="بخش ۱: اصلاح سر و صورت">
          <img class="b2-c2__img" src="assets/d04f18af2d8a0b3f03a5f361196f7110.png" alt="" style="filter: grayscale(1); opacity: .85; object-position: center 30%;">
          <div class="b2-c2__txt">
            <span class="b2-c2__who"><span>بخش ۱</span></span>
            <span class="b2-c1__s">اصلاح سر و صورت</span>
          </div>
        </article>
        <article role="listitem" class="b2-c2" style="min-height: 88px;" aria-label="بخش ۲: فیشیال">
          <img class="b2-c2__img" src="assets/90115837df8d77a59655b3ba95cf13ff.png" alt="" style="filter: grayscale(1); opacity: .85; object-position: center 40%;">
          <div class="b2-c2__txt">
            <span class="b2-c2__who"><span>بخش ۲</span></span>
            <span class="b2-c1__s">فیشیال</span>
          </div>
        </article>
        <article role="listitem" class="b2-c2" style="min-height: 88px;" aria-label="بخش ۳: رنگ ریش">
          <img class="b2-c2__img" src="assets/d17a436f28cd58a1594e31dbed06e06e.png" alt="" style="filter: grayscale(1); opacity: .85; object-position: center 30%;">
          <div class="b2-c2__txt">
            <span class="b2-c2__who"><span>بخش ۳</span></span>
            <span class="b2-c1__s">رنگ ریش</span>
          </div>
        </article>
      </div>
    </section>
    <a href="/customer/book?service=groom-package" class="rv-btn rv-btn--primary rv-btn--block">ثبت درخواست تازه</a>
  </main>

  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-current="page" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</body>
</html>
