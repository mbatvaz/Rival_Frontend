<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{background:#d7d9dd}body{margin:0}body>.rv-board{margin:0 auto}</style>
<title>CUS-03 — نوبت‌های من — پیش رو (Default)</title>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
</head>
<body>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نوبت‌های من</h1>
    <a href="/customer/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>
  <main style="padding: var(--space-2) var(--space-4) 128px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b3-tabrow">
      <div class="rv-seg rv-glass b3-seg-full" role="tablist" aria-label="نوبت‌های من">
        <button type="button" id="t-up" role="tab" aria-selected="true" aria-controls="p-up">پیش رو<span class="b3-n" aria-label="۳ نوبت پیش رو">۳</span></button>
        <button type="button" id="t-past" role="tab" aria-selected="false" aria-controls="p-past">گذشته<span class="b3-n" aria-label="۵ نوبت گذشته">۵</span></button>
      </div>
      <div class="rv-card rv-glass b3-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b3-fcard__b" aria-haspopup="dialog" aria-label="فیلتر نوبت‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <div id="p-up" role="tabpanel" aria-labelledby="t-up">
      <ol class="b2-tl2" aria-label="نوبت‌های پیش رو، به تفکیک ماه">
        <li class="b2-tg">
          <span class="b2-tg__m">مهر</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="پنج‌شنبه ۲۳ مهر، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر، رزرو شده">
              <img class="b2-c2__img" src="assets/d04f18af2d8a0b3f03a5f361196f7110.png" alt="" style="object-position: center 35%;">
              <a href="/customer/appointments/BK-48213" class="b2-c2__hit" aria-label="جزئیات نوبت پنج‌شنبه ۲۳ مهر، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۲۳</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="assets/91414c584d355fb5cf7028e54d9ed0fb.png" alt=""></span><span>امیر</span></span>
                <span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span>
              </div>
            </article></div>
            <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="سه‌شنبه ۲۸ مهر، ساعت ۱۵:۳۰، اصلاح سر با سینا، رزرو شده">
              <img class="b2-c2__img" src="assets/7c4f31dfbf051a4d393c8081487798e2.png" alt="" style="object-position: center 30%;">
              <a href="/customer/appointments/BK-48390" class="b2-c2__hit" aria-label="جزئیات نوبت سه‌شنبه ۲۸ مهر، ساعت ۱۵:۳۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۲۸</b><span class="b2-c1__d">سه‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۵:۳۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="assets/bd5966bca0239b5b2db570699eedbbb4.png" alt=""></span><span>سینا</span></span>
                <span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span>
              </div>
            </article></div>
          </div>
        </li>
        <li class="b2-tg">
          <span class="b2-tg__m">آبان</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2 b3-up" aria-label="پنج‌شنبه ۱۴ آبان، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر، رزرو شده">
              <img class="b2-c2__img" src="assets/d04f18af2d8a0b3f03a5f361196f7110.png" alt="" style="object-position: center 35%;">
              <a href="/customer/appointments/BK-48477" class="b2-c2__hit" aria-label="جزئیات نوبت پنج‌شنبه ۱۴ آبان، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۱۴</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="assets/91414c584d355fb5cf7028e54d9ed0fb.png" alt=""></span><span>امیر</span></span>
                <span class="rv-tag is-ink"><i class="ri ri-check-circle"></i>رزرو شده</span>
              </div>
            </article></div>
          </div>
        </li>
      </ol>
    </div>
  </main>
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-current="page" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</body>
</html>
