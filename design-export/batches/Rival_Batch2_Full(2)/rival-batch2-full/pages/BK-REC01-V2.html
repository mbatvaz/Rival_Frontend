<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-REC01 — رزرو دوره‌ای — فهرست، کارت نسخه ۲ (تصویر سمت چپ با گرادیان)</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book" class="rv-icon-btn" aria-label="بازگشت به رزرو نوبت"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو دوره‌ای</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <!-- نسخه ۲ (تأیید مالک): کل کارت دکمه ویرایش است و پنجره ویرایش را باز می‌کند؛ حذف فقط داخل پنجره ویرایش -->
    <ol class="b2-tl2" aria-label="نوبت‌های شما، به تفکیک ماه">
        <li class="b2-tg">
          <span class="b2-tg__m">مهر</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2" aria-label="نوبت ۱، پنج‌شنبه ۲۳ مهر، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر">
              <img class="b2-c2__img" src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;">
              <a href="#edit-1" class="b2-c2__hit" aria-haspopup="dialog" aria-label="ویرایش نوبت ۱، پنج‌شنبه ۲۳ مهر، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۲۳</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span>امیر</span></span>
                
              </div>
            </article></div>
          </div>
        </li>
        <li class="b2-tg">
          <span class="b2-tg__m">آبان</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2" aria-label="نوبت ۲، پنج‌شنبه ۱۴ آبان، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر">
              <img class="b2-c2__img" src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;">
              <a href="#edit-2" class="b2-c2__hit" aria-haspopup="dialog" aria-label="ویرایش نوبت ۲، پنج‌شنبه ۱۴ آبان، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۱۴</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span>امیر</span></span>
                
              </div>
            </article></div>
          </div>
        </li>
        <li class="b2-tg">
          <span class="b2-tg__m">آذر</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2" aria-label="نوبت ۳، پنج‌شنبه ۵ آذر، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر">
              <img class="b2-c2__img" src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;">
              <a href="#edit-3" class="b2-c2__hit" aria-haspopup="dialog" aria-label="ویرایش نوبت ۳، پنج‌شنبه ۵ آذر، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۵</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span>امیر</span></span>
                
              </div>
            </article></div>
            <div class="b2-c2w"><article class="b2-c2" aria-label="نوبت ۴، پنج‌شنبه ۲۶ آذر، ساعت ۱۸:۰۰، اصلاح سر با طاها">
              <img class="b2-c2__img" src="../assets/img/25158cc1884d40bc22f1d5461e1c162f.png" alt="" style="object-position: center 30%;">
              <a href="#edit-4" class="b2-c2__hit" aria-haspopup="dialog" aria-label="ویرایش نوبت ۴، پنج‌شنبه ۲۶ آذر، ساعت ۱۸:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۲۶</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۸:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/6bb6abcc37e587b42ed96e8dcda0d273.png" alt=""></span><span>طاها</span></span>
                
              </div>
            </article></div>
          </div>
        </li>
        <li class="b2-tg">
          <span class="b2-tg__m">دی</span>
          <div class="b2-tg__items">
            <div class="b2-c2w"><article class="b2-c2" aria-label="نوبت ۵، پنج‌شنبه ۱۷ دی، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر">
              <img class="b2-c2__img" src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;">
              <a href="#edit-5" class="b2-c2__hit" aria-haspopup="dialog" aria-label="ویرایش نوبت ۵، پنج‌شنبه ۱۷ دی، ساعت ۱۶:۰۰"></a>
              <div class="b2-c2__txt">
                <span class="b2-c2__when"><b class="b2-c1__t">۱۷</b><span class="b2-c1__d">پنج‌شنبه<span class="rv-sep" aria-hidden="true"></span><b class="b2-c2__time">۱۶:۰۰</b></span></span>
                <span class="b2-c1__s">اصلاح سر و صورت</span>
                <span class="b2-c2__who"><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span>امیر</span></span>
                
              </div>
            </article></div>
          </div>
        </li>
    </ol>
    <button type="button" class="b2-occ-add" aria-haspopup="dialog"><i class="ri ri-plus"></i>نوبت تازه</button>
  </main>

  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">۵ نوبت</span><span class="b2-bar__s">۲۳ مهر تا ۱۷ دی، همه با یک پرداخت</span></div>
    <a href="/customer/recurring/checkout" class="rv-btn rv-btn--primary">ادامه</a>
  </div>
</div>
</x-dc>

</body>
</html>
