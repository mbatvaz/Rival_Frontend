<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-F01 — زمان‌های آزاد — زمانی نیست</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book/stylist" class="rv-icon-btn" aria-label="بازگشت به انتخاب آرایشگر"><i class="ri ri-arrow-right"></i></a>
    <h1>انتخاب زمان<span class="f-bar-in__sub">قدم ۳ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۳ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="margin: 0 var(--space-1);"><i style="width: 100%;"></i></div>
    <div class="b2-ctx b2-ctx--lg rv-glass">
      <span class="b2-ctx__media"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">اصلاح سر و صورت</div><div class="b2-ctx__s"><span class="rv-avatar"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span>با امیر</div></div>
    </div>
    <!-- در کل افق یک ماه زمانی نیست: نوار روزها و ساعت‌ها حذف می‌شوند؛ اعلان آزادشدن اقدام اصلی است -->
    <section class="rv-empty" style="padding-top: var(--space-6);" aria-labelledby="f-none">
      <span class="rv-tile rv-tile--xl"><i class="ri ri-xl ri-calendar-x"></i></span>
      <h2 id="f-none" class="rv-empty__t" style="margin: 0;">امیر تا یک ماه آینده زمان آزادی ندارد</h2>
      <p class="rv-empty__d" style="margin-top: 0; max-width: 290px;">با آزاد شدن اولین زمان از امیر برای این خدمت، یک پیامک می‌گیرید. هیچ زمانی برای شما نگه داشته نمی‌شود.</p>
      <a href="/customer/book/stylist" class="rv-link"><i class="ri ri-sm ri-users"></i>انتخاب آرایشگر دیگر</a>
    </section>
  </main>

  <!-- اقدام اصلی در منطقه شست: باز کردن برگه اعلان آزادشدن (BK-ALERT01)، جوهری -->
  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">زمانی آزاد نیست</span><span class="b2-bar__s">اعلان تا ۶ روز فعال می‌ماند</span></div>
    <a href="#alert" class="rv-btn rv-btn--primary" aria-haspopup="dialog"><i class="ri ri-bell-ring"></i>خبرم کنید</a>
  </div>
</div>
</x-dc>

</body>
</html>
