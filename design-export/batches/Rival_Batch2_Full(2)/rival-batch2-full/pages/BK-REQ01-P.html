<!doctype html>
<html lang="fa" dir="rtl">
<head>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">

<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نتیجه درخواست</h1>
    <span aria-hidden="true"></span>

  <main style="padding: var(--space-2) var(--space-4) var(--space-6); display: flex; flex-direction: column;">
    <section class="b2-res" aria-labelledby="res-t">
      <span class="rv-tile rv-tile--xl is-plum"><i class="ri ri-xl ri-send"></i></span>

      <h2 id="res-t" class="b2-res__t">درخواست شما ثبت شد</h2>
      <p class="b2-res__d">تا ۷ روز به درخواست شما پاسخ داده میشود. با رسیدن پاسخ پیامک می‌گیرید و ۳ ساعت فرصت پرداخت دارید.</p>
      <span class="b2-code">کد پیگیری <b class="rv-ltr">#RQ-30517</b></span>
      <div class="b2-done rv-glass">
        <div class="rv-row" style="align-items: center; gap: var(--space-3);">
          <span class="b2-ctx__media" style="width: 56px; height: 56px;"><img src="../assets/img/77258f3e11631abbb08f74bb37bf3f4e.png" alt="" style="width: 56px; height: 56px; border-radius: var(--radius-md); object-fit: cover;"><span class="rv-avatar" style="position: absolute; inset-inline-start: -8px; bottom: -6px; width: 28px; height: 28px; box-shadow: 0 0 0 2px var(--bg-surface);"><img src="../assets/img/e516c20f8690aba955f2d01d2f0055fc.png" alt=""></span></span>

        </div>
        <hr class="rv-divider" style="margin: 0;">
        <div class="rv-kv"><span>روز ترجیحی</span><b>۲۵ مهر</b></div>
        <div class="rv-kv"><span>زمان از روز</span><b>صبح</b></div>
      </div>
      <div class="b2-res__acts"><a href="/customer/requests/RQ-30517" class="rv-btn rv-btn--primary">مشاهده درخواست</a><a href="/customer" class="rv-btn rv-btn--secondary">بازگشت به خانه</a></div>
    </section>
  </main>
