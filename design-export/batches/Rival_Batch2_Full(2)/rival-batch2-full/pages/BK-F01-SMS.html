<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-F01 — زمان‌های آزاد — ورود از پیامک اعلان آزادشدن</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer" class="rv-icon-btn" aria-label="بازگشت به خانه"><i class="ri ri-arrow-right"></i></a>
    <h1>انتخاب زمان<span class="f-bar-in__sub">قدم ۳ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۳ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="margin: 0 var(--space-1);"><i style="width: 100%;"></i></div>
    <div class="b2-ctx b2-ctx--lg rv-glass">
      <span class="b2-ctx__media"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">اصلاح سر و صورت</div><div class="b2-ctx__s"><span class="rv-avatar"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span>با امیر</div></div>
    </div>
    <!-- ورود از پیامک اعلان آزادشدن: خدمت و آرایشگر ازپیش‌پرشده؛ هیچ نشانه‌ای از نگه‌داشت یا اولویت نیست -->
    <div class="rv-notice is-info" role="status">
      <i class="ri ri-refresh"></i>
      <div class="rv-grow">
        <div class="rv-notice__t">زمان‌ها همین حالا دوباره بررسی شدند</div>
        <div class="rv-notice__d">هیچ زمانی برای شما نگه داشته نشده است؛ هر زمانی که می‌بینید برای همه آزاد است.</div>
      </div>
    </div>
    <section aria-labelledby="f-day" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="f-day" class="f-h">روز و ساعت دلخواه</h2></div>
      <div class="rv-week rv-glass b2-days">
        <div class="b2-days__row" role="tablist" aria-label="روزهای قابل رزرو، تا یک ماه آینده">
          <button type="button" class="rv-wd is-today" role="tab" aria-selected="false" aria-label="سه‌شنبه ۲۱ مهر، امروز"><small>س</small><b>۲۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="چهارشنبه ۲۲ مهر"><small>چ</small><b>۲۲</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="پنج‌شنبه ۲۳ مهر"><small>پ</small><b>۲۳</b></button>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-label="جمعه ۲۴ مهر، سالن تعطیل است"><small>ج</small><b>۲۴</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="true" aria-label="شنبه ۲۵ مهر"><small>ش</small><b>۲۵</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="یکشنبه ۲۶ مهر"><small>ی</small><b>۲۶</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="دوشنبه ۲۷ مهر"><small>د</small><b>۲۷</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="سه‌شنبه ۲۸ مهر"><small>س</small><b>۲۸</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="چهارشنبه ۲۹ مهر"><small>چ</small><b>۲۹</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="پنج‌شنبه ۳۰ مهر"><small>پ</small><b>۳۰</b></button>
          <span class="b2-days__m" aria-hidden="true">آبان</span>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-label="جمعه ۱ آبان، سالن تعطیل است"><small>ج</small><b>۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="شنبه ۲ آبان"><small>ش</small><b>۲</b></button>
        </div>
      </div>
      <div class="b2-slots4" role="group" aria-label="زمان‌های آزاد شنبه ۲۵ مهر">
        <button type="button" class="rv-slot" aria-pressed="false">۱۰:۰۰</button>
        <button type="button" class="rv-slot" aria-pressed="false">۱۰:۳۰</button>
        <button type="button" class="rv-slot" aria-pressed="false">۱۱:۰۰</button>
        <button type="button" class="rv-slot" aria-pressed="false">۱۵:۰۰</button>
      </div>
    </section>
    <a href="#alert" class="b2-alert" aria-haspopup="dialog" style="position: absolute; inset-inline: var(--space-4); bottom: 98px;">
      <span class="rv-tile rv-tile--sm"><i class="ri ri-sm ri-bell-ring"></i></span>
      <span class="rv-grow"><span class="b2-alert__t" style="display: block;">این زمان‌ها مناسب نیست؟</span><span class="b2-alert__d">با آزاد شدن زمانی از امیر، پیامک بگیرید.</span></span>
      <i class="ri ri-sm ri-chevron-left rv-chev" aria-hidden="true"></i>
    </a>
  </main>

  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">زمانی انتخاب نشده</span><span class="b2-bar__s" id="bar-why">یک روز و ساعت آزاد انتخاب کنید</span></div>
    <button type="button" class="rv-btn rv-btn--primary" disabled aria-describedby="bar-why">ادامه</button>
  </div>
</div>
</x-dc>

</body>
</html>
