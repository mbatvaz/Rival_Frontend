<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-R01 — ثبت درخواست درخواستی — Default</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book" class="rv-icon-btn" aria-label="بازگشت به انتخاب خدمت"><i class="ri ri-arrow-right"></i></a>
    <h1>درخواست خدمت<span class="f-bar-in__sub">قدم ۲ از ۲</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۲ از ۲" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" style="margin: 0 var(--space-1);"><i style="width: 100%;"></i></div>
    <div class="b2-ctx b2-ctx--lg rv-glass">
      <span class="b2-ctx__media"><img src="../assets/img/1c84258e385a8c363a5038d64465d740.png" alt="" style="object-position: center 35%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">پکیج دامادی</div><div class="b2-ctx__s">خدمت چندبخشی</div></div>
    </div>
    <!-- اجزای خدمت مرکب فقط برای اطلاع؛ آرایشگر و زمان هر بخش را مدیر سالن تعیین می‌کند -->
    <section aria-labelledby="r-parts" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="r-parts" class="f-h">این پکیج شامل</h2></div>
      <ul class="b2-pk" aria-label="سه خدمت پکیج">
        <li class="b2-pk__i"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt=""><span class="b2-pk__t rv-glass">اصلاح سر و صورت</span></li>
        <li class="b2-pk__i"><img src="../assets/img/77258f3e11631abbb08f74bb37bf3f4e.png" alt=""><span class="b2-pk__t rv-glass">فیشیال</span></li>
        <li class="b2-pk__i"><img src="../assets/img/e6419b3ed7e00e7ebb393c24b05d9dea.png" alt=""><span class="b2-pk__t rv-glass">رنگ ریش</span></li>
      </ul>
      <p class="b2-note" style="color: var(--text-secondary);"><i class="ri ri-users"></i>مدیر سالن آرایشگر و زمان هر بخش را هماهنگ می‌کند و حداکثر تا ۷ روز پاسخ می‌دهد.</p>
    </section>
  </main>

  <!-- ثبت درخواست جوهری است؛ پولی پرداخت نمی‌شود -->
  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">پکیج دامادی</span><span class="b2-bar__s">بدون پرداخت در این مرحله</span></div>
    <a href="#submit" class="rv-btn rv-btn--primary">ثبت درخواست</a>
  </div>
</div>
</x-dc>

</body>
</html>
