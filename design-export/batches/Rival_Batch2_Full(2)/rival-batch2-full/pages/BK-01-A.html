<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-01 — انتخاب خدمت — Default</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <!-- نوار بالای صفحه داخلی: بازگشت، عنوان و قدم -->
  <header class="f-bar-in">
    <a href="/customer" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو نوبت<span class="f-bar-in__sub">قدم ۱ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 112px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۱ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="margin: 0 var(--space-1);"><i style="width: 33%;"></i></div>

    <!-- رزرو دوباره: آخرین و پرتکرارترین ترکیب؛ مستقیم به زمان‌های آزاد -->
    <section aria-labelledby="bk-q">
      <div class="f-head" style="margin-bottom: var(--space-2);"><h2 id="bk-q" class="f-h">رزرو دوباره</h2></div>
      <div class="f-quick__grid">
        <a class="rv-card rv-glass f-quick__card" href="/customer/book/times?service=face-hair&amp;stylist=amir" aria-label="رزرو دوباره اصلاح سر و صورت با امیر، آخرین رزرو شما">
          <span class="f-quick__media"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%"><span class="rv-avatar rv-avatar--sm f-quick__sty"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span></span>
          <span class="f-quick__txt"><span class="f-quick__t">اصلاح سر و صورت</span><span class="f-quick__s">امیر<span class="rv-sep" aria-hidden="true"></span>۱ ساعت</span></span>
        </a>
        <a class="rv-card rv-glass f-quick__card" href="/customer/book/times?service=hair&amp;stylist=taha" aria-label="رزرو دوباره اصلاح سر با طاها، پرتکرارترین رزرو شما">
          <span class="f-quick__media"><img src="../assets/img/25158cc1884d40bc22f1d5461e1c162f.png" alt="" style="object-position: center 30%;"><span class="rv-avatar rv-avatar--sm f-quick__sty"><img src="../assets/img/6bb6abcc37e587b42ed96e8dcda0d273.png" alt=""></span></span>
          <span class="f-quick__txt"><span class="f-quick__t">اصلاح سر</span><span class="f-quick__s">طاها<span class="rv-sep" aria-hidden="true"></span>۳۰ دقیقه</span></span>
        </a>
      </div>
    </section>

    <!-- انتخاب خدمت: چرخ‌فلک همه خدمات (ثابت، پیشنهادی، درخواستی)؛ کارت وسط بزرگ‌تر -->
    <section aria-labelledby="bk-h" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;">
        <h2 id="bk-h" class="f-h" style="font-size: 20px; line-height: 32px;">چه خدمتی می‌خواهید؟</h2>
        <a class="rv-link" href="/customer/recurring"><i class="ri ri-sm ri-repeat"></i>رزرو دوره‌ای</a>
      </div>
      <!-- چرخ‌فلک همه خدمات؛ نوع خدمت و مبلغ اینجا نمایش داده نمی‌شوند (تصمیم مالک، D10-25) -->
      <div class="f-car" role="radiogroup" aria-labelledby="bk-h" style="margin-top: var(--space-2);">
        <div class="f-svc is-side" role="radio" aria-checked="false" tabindex="0" aria-label="اصلاح سر، ۳۰ دقیقه">
          <img src="../assets/img/25158cc1884d40bc22f1d5461e1c162f.png" alt="" style="object-position: center 30%;">
          <span class="f-svc__pill rv-glass-strong"><b>اصلاح سر</b><span>۳۰ دقیقه</span></span>
        </div>
        <div class="f-svc is-center" role="radio" aria-checked="false" tabindex="0" aria-label="اصلاح سر و صورت، ۱ ساعت">
          <img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;">
          <span class="f-svc__pill rv-glass-strong"><b>اصلاح سر و صورت</b><span>۱ ساعت</span></span>
        </div>
        <div class="f-svc is-side" role="radio" aria-checked="false" tabindex="0" aria-label="فیشیال، ۱ ساعت">
          <img src="../assets/img/77258f3e11631abbb08f74bb37bf3f4e.png" alt="" style="object-position: center 40%;">
          <span class="f-svc__pill rv-glass-strong"><b>فیشیال</b><span>۱ ساعت</span></span>
        </div>
      </div>
      <div class="f-pager" aria-hidden="true" style="margin-top: var(--space-2);"><i></i><i class="is-on"></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>

  <!-- نوار پایین مشتری: در جریان رزرو هیچ تبی فعال نیست و دور «رزرو» حلقه جوهری است -->
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-current="page" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>

</body>
</html>
