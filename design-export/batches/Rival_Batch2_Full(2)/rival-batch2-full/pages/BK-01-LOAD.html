<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-01 — انتخاب خدمت — Loading</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو نوبت<span class="f-bar-in__sub">قدم ۱ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 112px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۱ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="margin: 0 var(--space-1);"><i style="width: 33%;"></i></div>
    <!-- اسکلت بعد از ۳۰۰ میلی‌ثانیه؛ فضای هر بخش از قبل رزرو شده تا صفحه جابه‌جا نشود -->
    <section aria-busy="true" aria-label="در حال بارگذاری رزرو دوباره">
      <div class="f-head" style="margin-bottom: var(--space-2);"><h2 class="f-h">رزرو دوباره</h2></div>
      <div class="f-quick__grid"><div class="rv-card rv-glass b2-skel-card"><span class="rv-skel" style="display: block; width: 100%; height: 104px; border-radius: var(--radius-md);"></span><span class="rv-skel" style="display: block; width: 72%; height: 14px;"></span><span class="rv-skel" style="display: block; width: 44%; height: 12px;"></span></div><div class="rv-card rv-glass b2-skel-card"><span class="rv-skel" style="display: block; width: 100%; height: 104px; border-radius: var(--radius-md);"></span><span class="rv-skel" style="display: block; width: 72%; height: 14px;"></span><span class="rv-skel" style="display: block; width: 44%; height: 12px;"></span></div></div>
    </section>
    <section aria-busy="true" aria-labelledby="bk-h" aria-describedby="bk-load" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;">
        <h2 id="bk-h" class="f-h" style="font-size: 20px; line-height: 32px;">چه خدمتی می‌خواهید؟</h2>
        <a class="rv-link" href="/customer/recurring"><i class="ri ri-sm ri-repeat"></i>رزرو دوره‌ای</a>
      </div>
      <div id="bk-load" class="f-car" role="status" aria-label="در حال بارگذاری خدمات" style="margin-top: var(--space-2);">
        <div class="f-svc is-side rv-skel"></div>
        <div class="f-svc is-center rv-skel"></div>
        <div class="f-svc is-side rv-skel"></div>
      </div>
      <div class="f-pager" aria-hidden="true" style="margin-top: var(--space-2);"><i></i><i class="is-on"></i><i></i></div>
    </section>
  </main>

  <!-- نوار پایین مشتری: در جریان رزرو هیچ تبی فعال نیست و دور «رزرو» حلقه جوهری است -->
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-current="page" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>

</body>
</html>
