<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-P01 — ثبت درخواست پیشنهادی — Default</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book/stylist" class="rv-icon-btn" aria-label="بازگشت به انتخاب آرایشگر"><i class="ri ri-arrow-right"></i></a>
    <h1>زمان ترجیحی<span class="f-bar-in__sub">قدم ۳ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۳ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="margin: 0 var(--space-1);"><i style="width: 100%;"></i></div>
    <div class="b2-ctx b2-ctx--lg rv-glass">
      <span class="b2-ctx__media"><img src="../assets/img/77258f3e11631abbb08f74bb37bf3f4e.png" alt="" style="object-position: center 40%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">فیشیال</div><div class="b2-ctx__s"><span class="rv-avatar"><img src="../assets/img/e516c20f8690aba955f2d01d2f0055fc.png" alt=""></span>با سینا</div></div>
    </div>
    <div class="rv-notice" role="note">
      <i class="ri ri-info"></i>
      <div class="rv-grow"><div class="rv-notice__d">این درخواست زمانی را قفل نمی‌کند. سینا تا ۷ روز پاسخ می‌دهد و پاسخ او ۳ ساعت برای پرداخت نگه داشته می‌شود.</div></div>
    </div>
    <!-- یک روز در افق یک ماه و یک زمان از روز (صبح، ظهر، بعد از ظهر، عصر)؛ هیچ «افزودن بازه دیگر» وجود ندارد (W9-10) -->
    <section aria-labelledby="p-day" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="p-day" class="f-h">کدام روز برایتان مناسب است؟</h2></div>
      <div class="rv-week rv-glass b2-days">
        <div class="b2-days__row" role="tablist" aria-label="روزهای قابل انتخاب، تا یک ماه آینده">
          <button type="button" class="rv-wd is-today" role="tab" aria-selected="false" aria-label="۲۱ مهر، امروز"><small>س</small><b>۲۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۲ مهر"><small>چ</small><b>۲۲</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۳ مهر"><small>پ</small><b>۲۳</b></button>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="۲۴ مهر، سالن تعطیل است"><small>ج</small><b>۲۴</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="true" aria-label="۲۵ مهر"><small>ش</small><b>۲۵</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۶ مهر"><small>ی</small><b>۲۶</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۷ مهر"><small>د</small><b>۲۷</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۸ مهر"><small>س</small><b>۲۸</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۹ مهر"><small>چ</small><b>۲۹</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۳۰ مهر"><small>پ</small><b>۳۰</b></button>
          <span class="b2-days__m" aria-hidden="true">آبان</span>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="۱ آبان، سالن تعطیل است"><small>ج</small><b>۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲ آبان"><small>ش</small><b>۲</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۳ آبان"><small>ی</small><b>۳</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۴ آبان"><small>د</small><b>۴</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۵ آبان"><small>س</small><b>۵</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۶ آبان"><small>چ</small><b>۶</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۷ آبان"><small>پ</small><b>۷</b></button>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="۸ آبان، سالن تعطیل است"><small>ج</small><b>۸</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۹ آبان"><small>ش</small><b>۹</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۰ آبان"><small>ی</small><b>۱۰</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۱ آبان"><small>د</small><b>۱۱</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۲ آبان"><small>س</small><b>۱۲</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۳ آبان"><small>چ</small><b>۱۳</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۴ آبان"><small>پ</small><b>۱۴</b></button>
          <button type="button" class="rv-wd is-off" role="tab" aria-selected="false" aria-disabled="true" aria-label="۱۵ آبان، سالن تعطیل است"><small>ج</small><b>۱۵</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۶ آبان"><small>ش</small><b>۱۶</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۷ آبان"><small>ی</small><b>۱۷</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۸ آبان"><small>د</small><b>۱۸</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۱۹ آبان"><small>س</small><b>۱۹</b></button>
          <button type="button" class="rv-wd" role="tab" aria-selected="false" aria-label="۲۰ آبان"><small>چ</small><b>۲۰</b></button>
        </div>
      </div>
    </section>
    <section aria-labelledby="p-time" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="p-time" class="f-h">چه زمانی از روز؟</h2></div>
      <div class="b2-parts4" role="group" aria-label="زمان مناسب از روز، فقط یکی"><button type="button" class="rv-slot" aria-pressed="true">صبح</button><button type="button" class="rv-slot" aria-pressed="false">ظهر</button><button type="button" class="rv-slot" aria-pressed="false">بعد از ظهر</button><button type="button" class="rv-slot" aria-pressed="false">عصر</button></div>
      <p class="rv-caption rv-muted" style="margin: 0;">فقط یکی قابل انتخاب است.</p>
    </section>
  </main>

  <!-- ثبت درخواست جوهری است، نه سبز؛ پولی پرداخت نمی‌شود -->
  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">۲۵ مهر</span><span class="b2-bar__s">صبح، بدون پرداخت</span></div>
    <a href="#submit" class="rv-btn rv-btn--primary">ثبت درخواست</a>
  </div>
</div>
</x-dc>

</body>
</html>
