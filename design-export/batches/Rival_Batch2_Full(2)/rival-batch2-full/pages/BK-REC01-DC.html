<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-REC01 — رزرو دوره‌ای — جهت ج «برنامه ماه‌به‌ماه»</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book" class="rv-icon-btn" aria-label="بازگشت به رزرو نوبت"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو دوره‌ای</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <!-- جهت ج «برنامه ماه‌به‌ماه»: هفت ماه افق در یک نگاه؛ هر ماه نوبت‌هایش یا دکمه افزودن -->
    <div class="f-head" style="margin-bottom: 0;"><h2 class="f-h" style="font-size: 20px; line-height: 32px;">برنامه شما</h2><span class="rv-tag is-success"><i class="ri ri-check"></i>۴ از حداقل ۳</span></div>
    <ol class="b2-mos" aria-label="ماه‌های قابل رزرو تا ۲۰ فروردین">
        <li class="b2-mo rv-glass"><span class="b2-mo__m">مهر</span>
          <button type="button" class="b2-mo__occ" aria-label="نوبت ۱، پنج‌شنبه ۲۳ مهر، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر؛ تغییر یا حذف">
            <span class="b2-mo__d"><b>۲۳</b><span>پنج‌شنبه</span></span>
            <span class="b2-mo__t">۱۶:۰۰</span>
            <span class="b2-mo__who"><span class="b2-mo__img"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span class="b2-mo__svc">اصلاح سر و صورت</span></span>
          </button>
        </li>
        <li class="b2-mo rv-glass"><span class="b2-mo__m">آبان</span>
          <button type="button" class="b2-mo__occ" aria-label="نوبت ۲، پنج‌شنبه ۲۱ آبان، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر؛ تغییر یا حذف">
            <span class="b2-mo__d"><b>۲۱</b><span>پنج‌شنبه</span></span>
            <span class="b2-mo__t">۱۶:۰۰</span>
            <span class="b2-mo__who"><span class="b2-mo__img"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span class="b2-mo__svc">اصلاح سر و صورت</span></span>
          </button>
        </li>
        <li class="b2-mo rv-glass"><span class="b2-mo__m">آذر</span>
          <button type="button" class="b2-mo__occ" aria-label="نوبت ۳، پنج‌شنبه ۱۹ آذر، ساعت ۱۸:۰۰، اصلاح سر با طاها؛ تغییر یا حذف">
            <span class="b2-mo__d"><b>۱۹</b><span>پنج‌شنبه</span></span>
            <span class="b2-mo__t">۱۸:۰۰</span>
            <span class="b2-mo__who"><span class="b2-mo__img"><img src="../assets/img/25158cc1884d40bc22f1d5461e1c162f.png" alt="" style="object-position: center 30%;"></span><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/6bb6abcc37e587b42ed96e8dcda0d273.png" alt=""></span><span class="b2-mo__svc">اصلاح سر</span></span>
          </button>
        </li>
        <li class="b2-mo rv-glass"><span class="b2-mo__m">دی</span>
          <button type="button" class="b2-mo__occ" aria-label="نوبت ۴، پنج‌شنبه ۱۷ دی، ساعت ۱۶:۰۰، اصلاح سر و صورت با امیر؛ تغییر یا حذف">
            <span class="b2-mo__d"><b>۱۷</b><span>پنج‌شنبه</span></span>
            <span class="b2-mo__t">۱۶:۰۰</span>
            <span class="b2-mo__who"><span class="b2-mo__img"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span><span class="rv-avatar rv-avatar--sm"><img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt=""></span><span class="b2-mo__svc">اصلاح سر و صورت</span></span>
          </button>
        </li>
        <li class="b2-mo b2-mo--empty"><span class="b2-mo__m">بهمن</span><button type="button" class="b2-mo__add" aria-label="افزودن نوبت در بهمن"><i class="ri ri-plus"></i></button></li>
        <li class="b2-mo b2-mo--empty"><span class="b2-mo__m">اسفند</span><button type="button" class="b2-mo__add" aria-label="افزودن نوبت در اسفند"><i class="ri ri-plus"></i></button></li>
        <li class="b2-mo b2-mo--empty b2-mo--wide"><span class="b2-mo__m">فروردین <small>تا ۲۰ فروردین</small></span><button type="button" class="b2-mo__add" aria-label="افزودن نوبت در فروردین"><i class="ri ri-plus"></i></button></li>
    </ol>
    <p class="rv-caption rv-muted" style="margin: 0 var(--space-1);">هر نوبت خدمت، آرایشگر و زمان خودش را دارد. در یک ماه چند نوبت هم می‌شود؛ تا ۲۰ فروردین.</p>
  </main>

  <div class="rv-actionbar rv-glass-strong b2-bar">
    <div class="b2-bar__sum"><span class="b2-bar__t">۴ نوبت</span><span class="b2-bar__s">از ۲۳ مهر تا ۱۷ دی</span></div>
    <a href="/customer/recurring/checkout" class="rv-btn rv-btn--primary">ادامه</a>
  </div>
</div>
</x-dc>

</body>
</html>
