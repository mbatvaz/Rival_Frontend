<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>PAY-RES — نتیجه پرداخت — در حال بررسی</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <span aria-hidden="true"></span>
    <h1>نتیجه پرداخت</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) var(--space-6); display: flex; flex-direction: column;">
    <!-- گذرا: بازگشت از درگاه موفقیت قطعی نیست؛ بدون دکمه، بدون موفقیت جعلی -->
    <section class="b2-res" aria-labelledby="res-t">
      <span class="rv-tile rv-tile--xl is-info"><i class="ri ri-xl ri-refresh"></i></span>
      <span class="rv-tag is-info is-live"><span class="rv-tag__dot"></span>در حال بررسی</span>
      <h2 id="res-t" class="b2-res__t">در حال بررسی پرداخت</h2>
      <p class="b2-res__d" role="status">نتیجه را از بانک می‌گیریم. چند ثانیه صبر کنید و این صفحه را نبندید.</p>
      <div class="b2-res__acts"><a href="/customer" class="rv-btn rv-btn--secondary">بازگشت به خانه</a></div>
    </section>
  </main>
</div>
</x-dc>

</body>
</html>
