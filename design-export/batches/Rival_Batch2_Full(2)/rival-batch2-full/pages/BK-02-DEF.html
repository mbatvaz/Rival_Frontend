<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>BK-02 — انتخاب آرایشگر — Default</title>

<link rel="stylesheet" href="../assets/ds/rival/tokens.css">
<link rel="stylesheet" href="../assets/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../assets/rv-fixes.css">
<link rel="stylesheet" href="../assets/rv-final.css">
<link rel="stylesheet" href="../assets/rv-b2.css">
</head>
<body style="margin:0;background:#E7E8EB;display:flex;justify-content:center">
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="/customer/book" class="rv-icon-btn" aria-label="بازگشت به انتخاب خدمت"><i class="ri ri-arrow-right"></i></a>
    <h1>انتخاب آرایشگر<span class="f-bar-in__sub">قدم ۲ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۲ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" style="margin: 0 var(--space-1);"><i style="width: 66%;"></i></div>
    <!-- خدمت انتخاب‌شده؛ همان نوار زمینه بزرگ BK-F01، بدون آرایشگر -->
    <div class="b2-ctx b2-ctx--lg rv-glass">
      <span class="b2-ctx__media"><img src="../assets/img/9115564573058efd89988f589f50b4ee.png" alt="" style="object-position: center 35%;"></span>
      <div class="rv-grow"><div class="b2-ctx__t">اصلاح سر و صورت</div><div class="b2-ctx__s">خدمت انتخاب‌شده</div></div>
    </div>
    <!-- لمس آرایشگر = رفتن به قدم ۳. فقط آرایشگران فعال، نگاشت‌شده به این خدمت و دارای زمان آزاد نمایش داده می‌شوند؛ بقیه اصلاً نمی‌آیند -->
    <section aria-labelledby="st-h" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <div class="f-head" style="margin-bottom: 0;"><h2 id="st-h" class="f-h" style="font-size: 20px; line-height: 32px;">با کدام آرایشگر؟</h2></div>
      <div class="f-car" role="list" aria-labelledby="st-h" style="margin-top: var(--space-2);">
        <div class="f-svc is-side" role="link" tabindex="0" aria-label="طاها؛ رفتن به انتخاب زمان">
          <img src="../assets/img/6bb6abcc37e587b42ed96e8dcda0d273.png" alt="" style="object-position: center 18%;">
          <span class="f-svc__pill rv-glass-strong"><b>طاها</b></span>
        </div>
        <div class="f-svc is-center" role="link" tabindex="0" aria-label="امیر؛ رفتن به انتخاب زمان">
          <img src="../assets/img/b7faac4034c06ba5781923a5e4432418.png" alt="" style="object-position: center 18%;">
          <span class="f-svc__pill rv-glass-strong"><b>امیر</b></span>
        </div>
        <div class="f-svc is-side" role="link" tabindex="0" aria-label="سینا؛ رفتن به انتخاب زمان">
          <img src="../assets/img/e516c20f8690aba955f2d01d2f0055fc.png" alt="" style="object-position: center 18%;">
          <span class="f-svc__pill rv-glass-strong"><b>سینا</b></span>
        </div>
      </div>
      <div class="f-pager" aria-hidden="true" style="margin-top: var(--space-2);"><i></i><i class="is-on"></i><i></i></div>
    </section>
  </main>

  <!-- لمس هر آرایشگر مستقیم به انتخاب زمان می‌رود؛ دکمه «ادامه» لازم نیست -->
  <!-- نوار پایین مشتری: در جریان رزرو هیچ تبی فعال نیست و دور «رزرو» حلقه جوهری است -->
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-current="page" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>
</x-dc>

</body>
</html>
