<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>AUTH-01 — ورود — ورود با رمز عبور</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px; display: flex; flex-direction: column;">
  <!-- نوار بالا: فقط بازگشت به خانه -->
  <div class="f-auth-top"><a href="/" class="rv-icon-btn" aria-label="بازگشت به خانه"><i class="ri ri-arrow-right"></i></a></div>

  <!-- سرآغاز: لوگوی ریوال، عنوان و یک خط -->
  <div class="f-auth-hero">
    <a href="/" class="f-auth-mark" aria-label="ریوال — خانه"><span class="rv-logo-ink" role="img" aria-label="Rival" style="height: 32px; color: var(--text-primary);"></span></a>
    <h1 class="f-auth__t">ورود با رمز عبور</h1>
    <p class="f-auth__d">اگر برای حسابتان رمز گذاشته‌اید</p>
  </div>

  <main class="f-auth">
    <section class="rv-card rv-glass-strong rv-card--lg f-auth__card">
      <!-- فقط وقتی کاربر از دکمه رزرو آمده -->
      <div class="f-auth-ret"><i class="ri ri-calendar-plus"></i><span>بعد از ورود به <b>رزرو نوبت</b> برمی‌گردید.</span></div>
      <div class="rv-field">
        <label for="f-ph">شماره موبایل</label>
        <div class="rv-input"><i class="ri ri-smartphone"></i><input id="f-ph" class="rv-ltr" type="tel" inputmode="numeric" autocomplete="tel" value="۰۹۱۴ ۳۲۱ ۴۵۶۷"></div>
      </div>
      <div class="rv-field">
        <label for="f-pw">رمز عبور</label>
        <div class="rv-input is-focus"><i class="ri ri-lock"></i><input id="f-pw" class="rv-ltr" type="password" autocomplete="current-password" value="••••••••"><button class="rv-icon-btn rv-icon-btn--plain f-eye" type="button" aria-label="نمایش رمز" aria-pressed="false"><i class="ri ri-eye-off"></i></button></div>
      </div>
      <button class="rv-btn rv-btn--primary rv-btn--block" type="submit">ورود</button>
    </section>
  </main>

  <!-- روش‌های جایگزین، بیرون از کارت فرم -->
  <div class="f-auth-alts">
    <button class="rv-btn rv-btn--glass rv-glass rv-btn--block" type="button"><i class="ri ri-sms"></i>ورود با کد پیامکی</button>
    <button class="rv-btn rv-btn--glass rv-glass rv-btn--block" type="button"><i class="ri ri-fingerprint"></i>ورود با Passkey</button>
  </div>

  <!-- پای صفحه ورود: فقط حقوق و سازنده، مثل پای صفحات عمومی -->
  <footer class="f-auth-foot">
    <span class="rv-caption rv-muted">تمام حقوق این وب‌سایت برای سالن ریوال محفوظ است.</span>
    <a href="#" class="rv-row rv-caption rv-muted" style="gap: 6px; text-decoration: none; min-height: 44px;">توسعه‌یافته توسط<span style="font-weight: 400; color: var(--text-secondary);">ودان</span><img src="/_blob/c14b1a8859659282316990bd890f14a9" alt="" style="width: 20px; height: 20px; object-fit: contain;"></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
