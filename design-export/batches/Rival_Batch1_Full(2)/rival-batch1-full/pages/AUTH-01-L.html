<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>AUTH-01 — ورود — محدودیت تلاش</title>
<link rel="stylesheet" href="../css/ds/rival/tokens.css">
<link rel="stylesheet" href="../css/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../css/rv-fixes.css">
<link rel="stylesheet" href="../css/rv-final.css">
<style>body{margin:0;background:#e9e9ec}.rv-board{margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}</style>
</head>
<body>

<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px; display: flex; flex-direction: column;">
  <!-- نوار بالا: فقط بازگشت به خانه -->
  <div class="f-auth-top"><a href="/" class="rv-icon-btn" aria-label="بازگشت به خانه"><i class="ri ri-arrow-right"></i></a></div>

  <!-- سرآغاز: لوگوی ریوال، عنوان و یک خط -->
  <div class="f-auth-hero">
    <a href="/" class="f-auth-mark" aria-label="ریوال — خانه"><span class="rv-logo-ink" role="img" aria-label="Rival" style="height: 32px; color: var(--text-primary);"></span></a>
    <h1 class="f-auth__t">ورود یا ثبت‌نام</h1>
    <p class="f-auth__d">با یک کد پیامکی، بدون رمز عبور</p>
  </div>

  <main class="f-auth">
    <section class="rv-card rv-glass-strong rv-card--lg f-auth__card">
      <!-- فقط وقتی کاربر از دکمه رزرو آمده -->
      <div class="f-auth-ret"><i class="ri ri-calendar-plus"></i><span>بعد از ورود به <b>رزرو نوبت</b> برمی‌گردید.</span></div>
      <div class="rv-notice is-warning" role="alert">
        <i class="ri ri-clock-alert"></i>
        <div class="rv-grow">
          <div class="rv-notice__t">ورود با کد تا ساعت <b class="rv-ltr">۱۱:۴۲</b> بسته است</div>
          <div class="rv-notice__d">چند بار کد نادرست وارد شد و برای امنیت حساب، ورود با کد ۱۵ دقیقه بسته شد.</div>
        </div>
      </div>
      <div class="rv-field">
        <label for="f-ph">شماره موبایل</label>
        <div class="rv-input"><i class="ri ri-smartphone"></i><input id="f-ph" class="rv-ltr" type="tel" inputmode="numeric" autocomplete="tel" value="۰۹۱۴ ۳۲۱ ۴۵۶۷"></div>
      </div>
      <button class="rv-btn rv-btn--primary rv-btn--block" type="submit" disabled="">دریافت کد</button>
    </section>
  </main>

  <!-- روش‌های جایگزین، بیرون از کارت فرم -->
  <div class="f-auth-alts">
    <button class="rv-btn rv-btn--glass rv-glass rv-btn--block" type="button"><i class="ri ri-fingerprint"></i>ورود با Passkey</button>
    <button class="rv-btn rv-btn--glass rv-glass rv-btn--block" type="button"><i class="ri ri-key"></i>ورود با رمز عبور</button>
  </div>

  <!-- پای صفحه ورود: فقط حقوق و سازنده، مثل پای صفحات عمومی -->
  <footer class="f-auth-foot">
    <span class="rv-caption rv-muted">تمام حقوق این وب‌سایت برای سالن ریوال محفوظ است.</span>
    <a href="#" class="rv-row rv-caption rv-muted" style="gap: 6px; text-decoration: none; min-height: 44px;">توسعه‌یافته توسط<span style="font-weight: 400; color: var(--text-secondary);">ودان</span><img src="../assets/c14b1a8859659282316990bd890f14a9.png" alt="" style="width: 20px; height: 20px; object-fit: contain;"></a>
  </footer>
</div>

</body>
</html>
