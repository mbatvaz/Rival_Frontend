<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>PUB-02 — نمونه‌کارها — نمایشگر جزئیات باز</title>
<link rel="stylesheet" href="../css/ds/rival/tokens.css">
<link rel="stylesheet" href="../css/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../css/rv-fixes.css">
<link rel="stylesheet" href="../css/rv-final.css">
<style>body{margin:0;background:#e9e9ec}.rv-board{margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}</style>
</head>
<body>

<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <!-- نوار بالای صفحه عمومی: بازگشت به خانه، عنوان، ورود -->
  <header class="f-bar-in">
    <a href="/" class="rv-icon-btn" aria-label="بازگشت به خانه"><i class="ri ri-arrow-right"></i></a>
    <h1>نمونه‌کارها</h1>
    <a href="/login" class="rv-btn rv-btn--secondary rv-btn--sm rv-btn--pill f-pub-login">ورود</a>
  </header>

  <main style="padding: 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-4);">
    <p class="rv-body-sm rv-secondary" style="margin: 0;">کار واقعی آرایشگران سالن طاها. روی هر نمونه‌کار بزنید تا همه تصویرها و توضیحش را ببینید.</p>
    <!-- فیلتر chip: خدمت و آرایشگر؛ هر ردیف داخل خودش اسکرول می‌شود -->
    <div style="display: flex; flex-direction: column; gap: var(--space-1);">
      <div class="f-flt" role="group" aria-label="فیلتر خدمت"><span class="f-flt__l">خدمت</span><div class="f-chiprail"><button class="rv-chip" type="button" aria-pressed="true">همه خدمات</button><button class="rv-chip" type="button" aria-pressed="false">اصلاح سر</button><button class="rv-chip" type="button" aria-pressed="false">اصلاح ریش</button><button class="rv-chip" type="button" aria-pressed="false">اصلاح سر و صورت</button><button class="rv-chip" type="button" aria-pressed="false">فیشیال</button></div></div>
      <div class="f-flt" role="group" aria-label="فیلتر آرایشگر"><span class="f-flt__l">آرایشگر</span><div class="f-chiprail"><button class="rv-chip" type="button" aria-pressed="true">همه آرایشگران</button><button class="rv-chip" type="button" aria-pressed="false"><span class="rv-avatar"><img src="../assets/fa92ccd797f1260b3410b3afeb82e4a0.png" alt=""></span>طاها</button><button class="rv-chip" type="button" aria-pressed="false"><span class="rv-avatar"><img src="../assets/0f3b137d6cfa6cf07f7a1976f20b81fb.png" alt=""></span>امیر</button><button class="rv-chip" type="button" aria-pressed="false"><span class="rv-avatar">س</span>سینا</button><button class="rv-chip" type="button" aria-pressed="false"><span class="rv-avatar">م</span>مهدی</button></div></div>
    </div>
    <section style="display: flex; flex-direction: column; gap: var(--space-3);">
      <figure class="rv-hero f-pf f-pf--lead" style="height: 420px; --focus: center 30%;">
        <img src="../assets/3c5d827818a79d3b3182c1c25d9367b1.png" alt="فید کوتاه کلاسیک، اصلاح سر، کار امیر">
        <div class="rv-hero__top"><span class="rv-tag rv-tag--glass"><i class="ri ri-images"></i>۳ تصویر</span></div>
        <figcaption class="rv-hero__panel rv-glass-strong"><a class="f-pf__t" href="#pf" aria-haspopup="dialog">فید کوتاه کلاسیک</a><span class="f-pf__s">اصلاح سر<span class="rv-sep" aria-hidden="true"></span>امیر</span></figcaption>
      </figure>
    </section>
  </main>

  <!-- نمایشگر جزئیات نمونه‌کار: روی همان صفحه، Route جدا ندارد -->
  <div class="rv-scrim" aria-hidden="true"></div>
  <section class="rv-sheet rv-glass-strong f-viewer" role="dialog" aria-modal="true" aria-labelledby="f-pfv-t">
    <span class="f-viewer__grab" aria-hidden="true"></span>
    <div class="f-viewer__head">
      <span class="rv-grow"></span>
      <button class="rv-icon-btn" type="button" aria-label="بستن"><i class="ri ri-x"></i></button>
    </div>
    <div class="f-viewer__rail" role="region" aria-roledescription="گالری" aria-label="تصویرهای این نمونه‌کار؛ برای دیدن بقیه افقی بکشید">
      <figure><img src="../assets/3c5d827818a79d3b3182c1c25d9367b1.png" alt="فید کوتاه کلاسیک؛ در حال کوتاهی با قیچی" style="object-position: center 30%;"><span class="rv-tag rv-tag--glass">۱ از ۳</span></figure><figure><img src="../assets/680d177350899e6d10684ae0081fa5b2.png" alt="فید کوتاه کلاسیک؛ نتیجه از روبه‌رو" style="object-position: center 22%;"></figure><figure><img src="../assets/71f7a01d44eed42263b9e2f20deb4813.png" alt="فید کوتاه کلاسیک؛ بافت بالای سر" style="object-position: center 22%;"></figure>
    </div>
    <div class="fx-pager" aria-hidden="true"><i class="is-on"></i><i></i><i></i></div>
    <div class="f-viewer__body">
      <div>
        <h2 id="f-pfv-t" style="margin: 0; font-size: 20px; line-height: 32px; font-weight: 600;">فید کوتاه کلاسیک</h2>
        <div style="font-size: 13px; line-height: 22px; font-weight: 300; color: var(--text-secondary);">اصلاح سر<span class="rv-sep" aria-hidden="true"></span>مهر ۱۴۰۵</div>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 26px; font-weight: 400; color: var(--text-secondary);">کناره‌ها با ماشین از صفر تا شماره دو محو شده‌اند و بالای سر با قیچی کوتاه و بافت‌دار شده تا بدون واکس هم فرم بگیرد.</p>
      <div class="rv-row" style="gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line-hairline);">
        <span class="rv-avatar"><img src="../assets/0f3b137d6cfa6cf07f7a1976f20b81fb.png" alt=""></span>
        <div class="rv-grow"><div style="font-size: 15px; line-height: 24px; font-weight: 600;">امیر</div><div class="f-t3" style="font-size: 12px; line-height: 18px;">آرایشگر</div></div>
      </div>
    </div>
  </section>
</div>

</body>
</html>
