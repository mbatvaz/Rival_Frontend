<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>SHELL-CUS — پوسته مشتری — در صفحه رزرو</title>
<link rel="stylesheet" href="../css/ds/rival/tokens.css">
<link rel="stylesheet" href="../css/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../css/rv-fixes.css">
<link rel="stylesheet" href="../css/rv-final.css">
<style>body{margin:0;background:#e9e9ec}.rv-board{margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}</style>
</head>
<body>

<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <!-- نوار بالای صفحه داخلی: بازگشت، عنوان، (اقدام) -->
  <header class="f-bar-in">
    <a href="/customer" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>رزرو نوبت<span class="f-bar-in__sub">قدم ۱ از ۳</span></h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="padding: var(--space-2) var(--space-4) 112px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="rv-progress" role="progressbar" aria-label="قدم ۱ از ۳" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="margin: 0 var(--space-1);"><i style="width: 33%;"></i></div>

    <!-- رزرو دوباره: آخرین و پرتکرارترین ترکیب خدمت + آرایشگر؛ مستقیم به انتخاب زمان -->
    <section aria-labelledby="bk-q" class="f-quick">
      <div class="f-head" style="margin-bottom: var(--space-2);"><h2 id="bk-q" class="f-h">رزرو دوباره</h2></div>
      <div class="f-quick__grid">
        <a class="rv-card rv-glass f-quick__card" href="/customer/book/times?service=face-hair&amp;stylist=amir" aria-label="رزرو دوباره اصلاح سر و صورت با امیر، آخرین رزرو شما">
          <span class="f-quick__media"><img src="../assets/9bcf376b87aa77f58843d56fee2541ad.png" alt="" style="object-position: center 35%"><span class="rv-avatar rv-avatar--sm f-quick__sty"><img src="../assets/0f3b137d6cfa6cf07f7a1976f20b81fb.png" alt=""></span></span>
          <span class="f-quick__txt"><span class="f-quick__t">اصلاح سر و صورت</span><span class="f-quick__s">امیر<span class="rv-sep" aria-hidden="true"></span>۱ ساعت</span></span>
        </a>
        <a class="rv-card rv-glass f-quick__card" href="/customer/book/times?service=hair&amp;stylist=taha" aria-label="رزرو دوباره اصلاح سر با طاها، پرتکرارترین رزرو شما">
          <span class="f-quick__media"><img src="../assets/3c5d827818a79d3b3182c1c25d9367b1.png" alt="" style="object-position: center 30%;"><span class="rv-avatar rv-avatar--sm f-quick__sty"><img src="../assets/fa92ccd797f1260b3410b3afeb82e4a0.png" alt=""></span></span>
          <span class="f-quick__txt"><span class="f-quick__t">اصلاح سر</span><span class="f-quick__s">طاها<span class="rv-sep" aria-hidden="true"></span>۳۰ دقیقه</span></span>
        </a>
      </div>
    </section>

    <!-- انتخاب خدمت: چرخ‌فلک کارت‌های عمودی تمام‌عکس؛ کارت وسط بزرگ‌تر، دو کناری نیمه‌پیدا -->
    <section aria-labelledby="bk-h">
      <h2 id="bk-h" class="f-h" style="margin: 0 var(--space-1) var(--space-1); font-size: 22px; line-height: 34px;">چه خدمتی می‌خواهید؟</h2>
      <p class="f-t3" style="margin: 0 var(--space-1) var(--space-4); font-size: 13px; line-height: 20px;">ورق بزنید و لمس کنید؛ آرایشگر و زمان در قدم بعد.</p>
      <div class="f-car" role="radiogroup" aria-labelledby="bk-h">
        <div class="f-svc is-side" role="radio" aria-checked="false" tabindex="0" aria-label="اصلاح سر، ۳۰ دقیقه">
          <img src="../assets/3c5d827818a79d3b3182c1c25d9367b1.png" alt="" style="object-position: center 30%;">
          <span class="f-svc__pill rv-glass-strong"><b>اصلاح سر</b><span>۳۰ دقیقه</span></span>
        </div>
        <div class="f-svc is-center" role="radio" aria-checked="false" tabindex="0" aria-label="اصلاح سر و صورت، ۱ ساعت">
          <img src="../assets/9bcf376b87aa77f58843d56fee2541ad.png" alt="" style="object-position: center 35%;">
          <span class="f-svc__pill rv-glass-strong"><b>اصلاح سر و صورت</b><span>۱ ساعت</span></span>
        </div>
        <div class="f-svc is-side" role="radio" aria-checked="false" tabindex="0" aria-label="اصلاح ریش، ۳۰ دقیقه">
          <img src="../assets/a594ff45171e1ef6a113b85a7c7017ed.png" alt="" style="object-position: center 40%;">
          <span class="f-svc__pill rv-glass-strong"><b>اصلاح ریش</b><span>۳۰ دقیقه</span></span>
        </div>
      </div>
      <div class="f-pager" aria-hidden="true"><i></i><i class="is-on"></i><i></i><i></i></div>
    </section>
  </main>

  <!-- نوار پایین مشتری: چهار تب + دکمه جدای رزرو -->
  <div class="rv-dock rv-dock--book">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری مشتری">
      <a href="/customer" aria-label="خانه"><span class="rv-nav__ic"><i class="ri ri-home"></i></span><span class="rv-nav__l">خانه</span></a>
      <a href="/customer/requests" aria-label="درخواست‌ها"><span class="rv-nav__ic"><i class="ri ri-inbox"></i></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/customer/appointments" aria-label="نوبت‌ها"><span class="rv-nav__ic"><i class="ri ri-scissors"></i></span><span class="rv-nav__l">نوبت‌ها</span></a>
      <a href="#more" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
    <a href="/customer/book" class="rv-dock__book" aria-current="page" aria-label="رزرو نوبت"><i class="ri ri-calendar-plus"></i><span>رزرو</span></a>
  </div>
</div>

</body>
</html>
