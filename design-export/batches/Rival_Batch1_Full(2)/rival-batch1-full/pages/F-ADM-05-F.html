<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>زبان نهایی — برگه فیلتر نوبت‌ها</title>
<link rel="stylesheet" href="../css/ds/rival/tokens.css">
<link rel="stylesheet" href="../css/ds/rival/components/bundle.css">
<link rel="stylesheet" href="../css/rv-fixes.css">
<link rel="stylesheet" href="../css/rv-final.css">
<style>body{margin:0;background:#e9e9ec}.rv-board{margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}</style>
</head>
<body>

<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">

  <!-- صفحه مادر (غیرفعال زیر scrim) -->
  <div aria-hidden="true">
    <div class="rv-topbar"><span class="rv-icon-btn rv-icon-btn--plain"><i class="ri ri-arrow-right"></i></span><span class="rv-topbar__title">نوبت‌ها</span><span class="rv-icon-btn"><i class="ri ri-pending"></i><span class="rv-count is-plum">۳</span></span></div>
    <div style="padding: 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);">
      <div class="rv-seg rv-glass" style="display: flex;"><button style="flex: 1; justify-content: center;">من</button><button style="flex: 1; justify-content: center;">آرایشگر</button><button aria-selected="true" style="flex: 1; justify-content: center;">همه سالن</button></div>
      <div class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><span class="rv-muted">نام، موبایل یا کد پیگیری</span></div>
      <div class="rv-list rv-glass"><div class="rv-item"><span class="rv-avatar"><img src="../assets/680d177350899e6d10684ae0081fa5b2.png" alt=""></span><div class="rv-grow"><div class="rv-item__t">رضا کریمی</div><div class="rv-item__s">اصلاح سر و صورت</div></div><span class="rv-bk__time">۱۱:۰۰</span></div></div>
    </div>
  </div>
  <div class="rv-scrim"></div>

  <!-- برگه فیلتر -->
  <section class="rv-sheet rv-glass-strong" role="dialog" aria-modal="true" aria-labelledby="f-f-title" style="padding-bottom: 0; display: flex; flex-direction: column; max-height: 704px;">
    <div class="rv-grabber"></div>
    <div class="rv-between" style="margin-bottom: var(--space-2);">
      <h2 id="f-f-title" class="rv-h-md" style="margin: 0;">فیلتر نوبت‌ها</h2>
      <button class="rv-btn rv-btn--ghost rv-btn--sm" type="button">پاک کردن همه</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--space-5); padding-bottom: var(--space-4);">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2);">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">بازه تاریخ</legend>
        <div class="rv-row rv-wrap" style="gap: var(--space-2);">
          <button class="rv-chip" type="button">امروز</button>
          <button class="rv-chip" aria-pressed="true" type="button">این هفته</button>
          <button class="rv-chip" type="button">این ماه</button>
          <button class="rv-chip" type="button"><i class="ri ri-calendar-range"></i>بازه دلخواه</button>
        </div>
        <div class="rv-row" style="gap: var(--space-2);">
          <button type="button" class="rv-input" style="flex: 1; height: 48px; border: 0; justify-content: space-between;"><span class="rv-caption rv-muted">از</span><span style="color: var(--text-primary);">شنبه ۱۸ مهر</span></button>
          <button type="button" class="rv-input" style="flex: 1; height: 48px; border: 0; justify-content: space-between;"><span class="rv-caption rv-muted">تا</span><span style="color: var(--text-primary);">جمعه ۲۴ مهر</span></button>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">وضعیت</legend>
        <div class="rv-row rv-wrap" style="gap: var(--space-2);">
          <button class="rv-chip" aria-pressed="true" type="button">رزرو شده</button>
          <button class="rv-chip" type="button">انجام شده</button>
          <button class="rv-chip" type="button">عدم حضور</button>
          <button class="rv-chip" type="button">لغو شده</button>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">خدمت</legend>
        <div class="rv-row rv-wrap" style="gap: var(--space-2);">
          <button class="rv-chip" type="button" style="padding-inline-start: 4px;"><img src="../assets/3c5d827818a79d3b3182c1c25d9367b1.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح سر</button>
          <button class="rv-chip" type="button" style="padding-inline-start: 4px;"><img src="../assets/9bcf376b87aa77f58843d56fee2541ad.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح سر و صورت</button>
          <button class="rv-chip" type="button" style="padding-inline-start: 4px;"><img src="../assets/a594ff45171e1ef6a113b85a7c7017ed.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح ریش</button>
          <button class="rv-chip" type="button" style="padding-inline-start: 4px;"><img src="../assets/292fb613ec51d2bbc0968df4b1c1a315.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">فیشیال</button>
          <button class="rv-chip" type="button">رنگ ریش</button>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">آرایشگر</legend>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2);">
          <button type="button" aria-pressed="false" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;"><span class="rv-avatar rv-avatar--lg"><img src="../assets/fa92ccd797f1260b3410b3afeb82e4a0.png" alt=""></span><span class="rv-label rv-secondary">طاها</span></button>
          <button type="button" aria-pressed="true" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;"><span class="rv-avatar rv-avatar--lg" style="box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--text-primary);"><img src="../assets/0f3b137d6cfa6cf07f7a1976f20b81fb.png" alt=""></span><span class="rv-label" style="font-weight: 600;">امیر</span></button>
          <button type="button" aria-pressed="false" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;"><span class="rv-avatar rv-avatar--lg"><img src="../assets/d644c70eca4cddd5d2ab40d7e4691c84.png" alt=""></span><span class="rv-label rv-secondary">سینا</span></button>
          <button type="button" aria-pressed="false" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;"><span class="rv-avatar rv-avatar--lg">م</span><span class="rv-label rv-secondary">مهدی</span></button>
        </div>
      </fieldset>
    </div>

    <div class="rv-actionbar" style="margin: 0 calc(var(--space-5) * -1); box-shadow: none; border-top: 1px solid var(--line-hairline); border-radius: 0; padding-bottom: var(--space-6);">
      <button class="rv-btn rv-btn--primary rv-btn--block" type="button">نمایش ۶ نوبت</button>
    </div>
  </section>
</div>

</body>
</html>
