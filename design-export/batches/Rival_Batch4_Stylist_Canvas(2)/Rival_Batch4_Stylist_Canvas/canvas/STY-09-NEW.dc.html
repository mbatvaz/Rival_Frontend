      <div class="b4-ups"><div class="b4-up is-main" role="group" aria-label="تصویر ۱، تصویر اصلی" aria-current="true"><img src="/_blob/3d2706a58e1e77c6d7b58e4103baea41" alt="" style="object-position: center 30%;"><button type="button" class="b4-up__x" aria-label="برداشتن تصویر ۱"><i class="ri ri-sm ri-x"></i></button></div><div class="b4-up" role="group" aria-label="تصویر ۲"><img src="/_blob/e31f2f31c279bde7b2eec173e41c9a94" alt="" style="object-position: center 38%;"><button type="button" class="b4-up__x" aria-label="برداشتن تصویر ۲"><i class="ri ri-sm ri-x"></i></button></div><div class="b4-up is-up" role="group" aria-label="در حال بارگذاری تصویر ۳"><img src="/_blob/3d2706a58e1e77c6d7b58e4103baea41" alt="" style="object-position: center 20%;"><span class="b4-up__prog"><i style="width: 64%"></i></span><span class="b4-up__pct">۶۴٪</span></div><button type="button" class="rv-add b4-up b4-up--add"><i class="ri ri-plus" aria-hidden="true"></i>افزودن</button></div>
