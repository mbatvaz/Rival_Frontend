<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>STY-03 — درخواست‌ها — برگه فیلتر (در انتظار)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="rv-topbar">
    <h1 class="rv-topbar__title" style="margin: 0;">درخواست‌ها</h1>
    <span class="rv-grow"></span>
    <a href="/stylist/notifications" class="rv-icon-btn" aria-label="اعلان‌ها، ۱ خوانده‌نشده"><i class="ri ri-bell"></i><span class="rv-dot is-ink"></span></a>
  </header>

  <div aria-hidden="true" inert>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <p class="b4-lead">مشتری برای خدمت پیشنهادی، روز و بازه دلخواهش را فرستاده است. زمان دقیق و هزینه رزرو را شما تعیین می‌کنید.</p>
    <div class="b4-tabrow">
      <div class="rv-seg rv-glass b4-seg-full is-3" role="tablist" aria-label="درخواست‌ها">
        <button type="button" id="tab-open" role="tab" aria-selected="false" aria-controls="p-open">باز<span class="b4-n" aria-label="۳ درخواست">۳</span></button>
        <button type="button" id="tab-wait" role="tab" aria-selected="true" aria-controls="p-wait">در انتظار<span class="b4-n" aria-label="۱ درخواست">۱</span></button>
        <button type="button" id="tab-closed" role="tab" aria-selected="false" aria-controls="p-closed">بسته‌شده<span class="b4-n" aria-label="۳ درخواست">۳</span></button>
      </div>
      <div class="rv-card rv-glass b4-fcard is-icon"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b4-fcard__b" aria-haspopup="dialog" aria-label="فیلتر درخواست‌ها"><i class="ri ri-sm ri-filter"></i></button></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-5);">
    <!-- ۲. پاسخ داده‌اید، منتظر پرداخت مشتری: نوار نگه‌داشت ۳ ساعته زیر ردیف -->
    <section aria-labelledby="q-p">
      <div class="f-head"><h2 id="q-p" class="f-h">منتظر پرداخت مشتری</h2></div>
      <div class="b4-rqks">
        <div class="b4-rqk">
          <article class="b2-c2 b4-rqk__c" aria-label="درخواست فیشیال از مجید کاظمی، ۲:۳۰ تا آزاد شدن زمان">
            <div class="b4-rqk__main">
              <img class="b2-c2__img" src="/_blob/d1b75c21393c9d05ad0948b7f02e5b5c" alt="" style="object-position: center 40%;">
              <a href="/stylist/requests/RQ-2209" class="b2-c2__hit" aria-label="فیشیال، مجید کاظمی"></a>
              <div class="b2-c2__txt">
                <span class="b2-c1__s b4-rqk__t">فیشیال</span>
                <span class="b4-rqk__who"><span class="rv-avatar">م</span><span>مجید کاظمی</span></span>
                <span class="b4-rqk__pref">پاسخ شما: امروز ۱۵:۰۰<span class="rv-sep" aria-hidden="true"></span>۸۵٬۰۰۰ تومان</span>
              </div>
            </div>
            <div class="b4-rqk__due" role="timer">
              <div class="b4-rqk__row"><span><i class="ri ri-sm ri-hourglass" aria-hidden="true"></i>۲:۳۰ تا آزاد شدن زمان</span><small>تا ۱۴:۱۰</small></div>
              <div class="b4-rqk__bar" aria-hidden="true"><i style="width: 75%;"></i></div>
            </div>
          </article>
        </div>
      </div>
    </section>

    </div>
  </main>
  </div>

  <div class="rv-scrim"></div>
  <!-- برگه فیلتر: جست‌وجوی نام مشتری، وضعیت (بسته به زبانه باز یا بسته‌شده) و خدمت (فقط خدمات خود آرایشگر)؛ بدون ترتیب، طبق ویرایش مالک -->
  <section class="rv-sheet rv-glass-strong" role="dialog" aria-modal="true" aria-labelledby="f3-t" style="padding-bottom: 0; display: flex; flex-direction: column;">
    <div class="rv-grabber"></div>
    <div class="rv-between" style="margin-bottom: var(--space-2);">
      <h2 id="f3-t" class="rv-h-md" style="margin: 0;">فیلتر درخواست‌های در انتظار</h2>
      <button class="rv-btn rv-btn--ghost rv-btn--sm" type="button">پاک کردن همه</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-5); padding-bottom: var(--space-4);">
      <label class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><input placeholder="نام مشتری" aria-label="جست‌وجو با نام مشتری"></label>
      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">خدمت (فقط خدمات شما)</legend>
        <div class="rv-row rv-wrap b4-rg" role="radiogroup" aria-label="خدمت" style="gap: var(--space-2);">
          <button class="rv-chip" type="button" role="radio" aria-checked="false">همه</button><button class="rv-chip" type="button" role="radio" aria-checked="true" style="padding-inline-start: 4px;"><img src="/_blob/d1b75c21393c9d05ad0948b7f02e5b5c" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">فیشیال</button><button class="rv-chip" type="button" role="radio" aria-checked="false" style="padding-inline-start: 4px;"><img src="/_blob/25dd67dc1f5d0e444ac88c31345ce3c5" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">رنگ ریش</button><button class="rv-chip" type="button" role="radio" aria-checked="false" style="padding-inline-start: 4px;"><img src="/_blob/3d2706a58e1e77c6d7b58e4103baea41" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح سر و صورت</button></div>
      </fieldset>
    </div>
    <div class="rv-actionbar" style="margin: 0 calc(var(--space-5) * -1); box-shadow: none; border-top: 1px solid var(--line-hairline); border-radius: 0; padding-bottom: var(--space-6);">
      <button class="rv-btn rv-btn--primary rv-btn--block" type="button">نمایش ۱ درخواست</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
