<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>STY-05 — نوبت‌ها — برگه فیلتر پیش رو</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">

<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="#more" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>نوبت‌ها</h1>
    <span aria-hidden="true"></span>
  </header>

    <div aria-hidden="true" inert>
  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-5);">
    <div class="b4-tabrow">
      <div class="rv-seg rv-glass b4-seg-full" role="tablist" aria-label="نوبت‌ها">
        <button type="button" id="tab-up" role="tab" aria-selected="true" aria-controls="p-up">پیش رو<span class="b4-n" aria-label="۲۴ نوبت">۲۴</span></button>
        <button type="button" id="tab-past" role="tab" aria-selected="false" aria-controls="p-past">گذشته<span class="b4-n" aria-label="۱۲۶ نوبت">۱۲۶</span></button>
      </div>
      <div class="rv-card rv-glass b4-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b4-fcard__b" aria-haspopup="dialog" aria-label="فیلتر نوبت‌ها"><i class="ri ri-sm ri-filter"></i>فیلتر</button></div>
    </div>
  </main>
  </div>
  <div class="rv-scrim"></div>
  <!-- برگه فیلتر: جست‌وجو (نام مشتری، کد یا شماره)، وضعیت بسته به زبانه، بازه تاریخ و خدمت؛ بدون فیلتر آرایشگر -->
  <section class="rv-sheet rv-glass-strong" role="dialog" aria-modal="true" aria-labelledby="flt-t" style="padding-bottom: 0; display: flex; flex-direction: column;">
    <div class="rv-grabber"></div>
    <div class="rv-between" style="margin-bottom: var(--space-2);">
      <h2 id="flt-t" class="rv-h-md" style="margin: 0;">فیلتر نوبت‌های پیش رو</h2>
      <button class="rv-btn rv-btn--ghost rv-btn--sm" type="button">پاک کردن همه</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-5); padding-bottom: var(--space-4);">
      <label class="rv-input rv-input--search" style="height: 48px;"><i class="ri ri-search"></i><input placeholder="نام مشتری، کد نوبت یا شماره" aria-label="جست‌وجوی نوبت"></label>
      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">وضعیت</legend>
        <div class="rv-row rv-wrap" style="gap: var(--space-2);"><button class="rv-chip" type="button" aria-pressed="true">رزرو شده</button><button class="rv-chip" type="button" aria-pressed="false">در حال انجام</button></div>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2);">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">بازه تاریخ</legend>
        <div class="rv-row rv-wrap b4-rg" role="radiogroup" aria-label="بازه تاریخ" style="gap: var(--space-2);"><button class="rv-chip" type="button" role="radio" aria-checked="false">امروز</button><button class="rv-chip" type="button" role="radio" aria-checked="true">۷ روز آینده</button><button class="rv-chip" type="button" role="radio" aria-checked="false">۳۰ روز آینده</button><button class="rv-chip" type="button" role="radio" aria-checked="false"><i class="ri ri-calendar-range"></i>بازه دلخواه</button></div>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend class="rv-label" style="padding: 0; margin-bottom: var(--space-2);">خدمت (فقط خدمات شما)</legend>
        <div class="rv-row rv-wrap b4-rg" role="radiogroup" aria-label="خدمت" style="gap: var(--space-2);">
          <button class="rv-chip" type="button" role="radio" aria-checked="false">همه</button><button class="rv-chip" type="button" role="radio" aria-checked="true" style="padding-inline-start: 4px;"><img src="/_blob/3d2706a58e1e77c6d7b58e4103baea41" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح سر</button><button class="rv-chip" type="button" role="radio" aria-checked="false" style="padding-inline-start: 4px;"><img src="/_blob/3d2706a58e1e77c6d7b58e4103baea41" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">اصلاح سر و صورت</button><button class="rv-chip" type="button" role="radio" aria-checked="false" style="padding-inline-start: 4px;"><img src="/_blob/d1b75c21393c9d05ad0948b7f02e5b5c" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">فیشیال</button><button class="rv-chip" type="button" role="radio" aria-checked="false" style="padding-inline-start: 4px;"><img src="/_blob/e31f2f31c279bde7b2eec173e41c9a94" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">رنگ ریش</button></div>
      </fieldset>
    </div>
    <div class="rv-actionbar" style="margin: 0 calc(var(--space-5) * -1); box-shadow: none; border-top: 1px solid var(--line-hairline); border-radius: 0; padding-bottom: var(--space-6);">
      <button class="rv-btn rv-btn--primary rv-btn--block" type="button">نمایش 6 نوبت</button>
    </div>
  </section>
</div>
</x-dc>
