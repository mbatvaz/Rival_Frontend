<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>STY-05 — نوبت‌ها — نتیجه خالی</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rival/tokens.css">
<link rel="stylesheet" href="ds/rival/components/bundle.css">
<link rel="stylesheet" href="rv-fixes.css">
<link rel="stylesheet" href="rv-final.css">
<link rel="stylesheet" href="rv-b2.css">
<link rel="stylesheet" href="rv-b3.css">
<link rel="stylesheet" href="rv-b4.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="rv rv-board rv-final" dir="rtl" lang="fa" style="width: 390px; height: 844px;">
  <header class="f-bar-in">
    <a href="#more" class="rv-icon-btn" aria-label="بازگشت"><i class="ri ri-arrow-right"></i></a>
    <h1>نوبت‌ها</h1>
    <span aria-hidden="true"></span>
  </header>

  <main class="f-enter" style="padding: var(--space-2) var(--space-4) 120px; display: flex; flex-direction: column; gap: var(--space-4);">
    <div class="b4-tabrow">
      <div class="rv-seg rv-glass b4-seg-full" role="tablist" aria-label="نوبت‌ها">
        <button type="button" id="tab-up" role="tab" aria-selected="false" aria-controls="p-up">پیش رو<span class="b4-n" aria-label="۲۴ نوبت">۲۴</span></button>
        <button type="button" id="tab-past" role="tab" aria-selected="true" aria-controls="p-past">گذشته<span class="b4-n" aria-label="۱۲۶ نوبت">۱۲۶</span></button>
      </div>
      <div class="rv-card rv-glass b4-fcard"><button type="button" class="rv-btn rv-btn--ghost rv-btn--sm b4-fcard__b" aria-haspopup="dialog" aria-label="فیلتر، 3 فیلتر فعال"><i class="ri ri-sm ri-filter"></i>فیلتر<span class="rv-count">3</span></button></div>
    </div>
    <div class="rv-row rv-wrap" style="gap: var(--space-2);">
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف جست‌وجوی BK-4905">جست‌وجو: BK-4905<i class="ri ri-x"></i></button>
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف فیلتر عدم حضور">عدم حضور<i class="ri ri-x"></i></button>
      <button class="rv-chip" aria-pressed="true" type="button" aria-label="حذف فیلتر ۳۰ روز اخیر">۳۰ روز اخیر<i class="ri ri-x"></i></button>
    </div>
    <div class="b3-empty" role="status">
      <span class="b3-empty__ic" aria-hidden="true"><i class="ri ri-search"></i></span>
      <h2 class="b3-empty__t">نوبتی با این جست‌وجو و فیلترها نیست</h2>
      <p class="b3-empty__d">کد را دوباره بررسی کنید یا یکی از فیلترها را بردارید. فقط نوبت‌های خودتان اینجا هستند.</p>
      <button type="button" class="rv-btn rv-btn--secondary">پاک کردن جست‌وجو و فیلترها</button>
    </div>
  </main>

  <!-- نوار پایین کارکنان (SHELL-STY) -->
  <div class="rv-dock">
    <nav class="rv-nav rv-glass-strong" aria-label="ناوبری آرایشگر">
      <a href="/stylist" aria-label="داشبورد"><span class="rv-nav__ic"><i class="ri ri-grid"></i></span><span class="rv-nav__l">داشبورد</span></a>
      <a href="/stylist/calendar" aria-label="تقویم"><span class="rv-nav__ic"><i class="ri ri-calendar"></i></span><span class="rv-nav__l">تقویم</span></a>
      <a href="/stylist/requests" aria-label="درخواست‌ها، ۳ درخواست منتظر پاسخ"><span class="rv-nav__ic"><i class="ri ri-inbox"></i><b class="rv-nav__badge is-plum">۳</b></span><span class="rv-nav__l">درخواست‌ها</span></a>
      <a href="/stylist/customers" aria-label="مشتری‌ها"><span class="rv-nav__ic"><i class="ri ri-users"></i></span><span class="rv-nav__l">مشتری‌ها</span></a>
      <a href="#more" aria-current="page" aria-label="بیشتر"><span class="rv-nav__ic"><i class="ri ri-menu"></i></span><span class="rv-nav__l">بیشتر</span></a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
